services:
  # # Frontend development container
  aisc-webapp:
    build: apps/webapp/
    image: aisc-webapp:latest
    pull_policy: never
    container_name: aisc-webapp
    environment:
      APP_API_URL: ${API_URL_EXTERNAL}
      APP_SHOW_PLUGIN_VISUALIZATION: ${SHOW_PLUGIN_VISUALIZATION}
      # Where the "Public Catalogue" button goes. The bundle ships the literal
      # placeholder APP_CATALOG_URL and env.sh replaces it at start, so leaving
      # this unset sends the button to the string "APP_CATALOG_URL" itself.
      APP_CATALOG_URL: ${CATALOGUE_EXTERNAL_URL:-http://localhost:8102}
      # Where the project was chosen and where the other five steps are.
      APP_LAUNCHER_URL: ${LAUNCHER_EXTERNAL_URL:-http://localhost:8100/}
    depends_on:
      - aisc-backend
    networks:
      - frontend

  aisc-backend:
    build: apps/backend/
    image: aisc-backend:latest
    pull_policy: never
    container_name: aisc-backend
    environment:
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET}
      S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET}
      S3_URL: ${S3_URL}
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_ENGINE: ${DB_ENGINE}
      DB_SCHEMA: ${DB_SCHEMA}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS}
      BACKEND_CSRF_TRUSTED_ORIGINS: ${BACKEND_CSRF_TRUSTED_ORIGINS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ENABLE_SSL_PROXY: true
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      PLUGIN_PATH: ${PLUGIN_PATH}
      PACKAGE_REGISTRY_URL: ${PACKAGE_REGISTRY_URL}
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX}
      # immudb audit ledger — inside docker the host is the SERVICE NAME, not localhost.
      IMMUDB_URL: immudb:3322
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # The gateway authenticates every request and passes the token it holds;
      # the engine verifies it against the realm rather than taking the
      # gateway's word for it. Defence in depth, and it costs a signature check.
      AUTH_ENABLED: "true"
      KEYCLOAK_ISSUER: ${KEYCLOAK_URL_EXTERNAL}/realms/aisc
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/aisc/protocol/openid-connect/certs
      MODEL_LISTING_SSL_VERIFY: ${MODEL_LISTING_SSL_VERIFY}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      immudb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:z
      - ./shared:/app/shared:z
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && uv run manage.py migrate --noinput 
      && uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --no-access-log"

  #
  aisc-eval-worker:
    platform: linux/amd64
    build:
      context: apps/eval/
    image: aisc-eval:latest
    pull_policy: never
    container_name: aisc-eval-worker
    # volumes:
    #   - ./eval-logging.yaml:/app/config/logging.yaml:ro
    environment:
      API_URL: ${API_URL} # Address of api-backend
      API_PREFIX: ${API_PREFIX}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      PLUGIN_PATH: ${PLUGIN_PATH}
      PACKAGE_REGISTRY_URL: ${PACKAGE_REGISTRY_URL}
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    depends_on:
      - aisc-backend
      - rabbitmq
      - redis
    networks:
      - backend
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:z
      - ./shared:/app/shared:z
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && celery -A aisc_eval.celery_worker worker --loglevel=debug"

  aisc-eval-flower:
    platform: linux/amd64
    image: aisc-eval:latest
    pull_policy: never
    container_name: aisc-eval-flower
    # volumes:
    #   - ./eval-logging.yaml:/app/config/logging.yaml:ro
    environment:
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      FLOWER_URL_PREFIX: flower
    depends_on:
      - aisc-eval-worker
      - aisc-backend
      - rabbitmq
      - redis
    volumes:
      - ${PLUGIN_PATH}:/app/plugins
      - ./shared:/app/shared
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && celery -A aisc_eval.celery_worker flower"
    healthcheck:
      test:
        - "CMD-SHELL"
        - celery --app aisc_eval.celery_app inspect ping -d "celery@$$HOSTNAME"
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # ── AI-compliance checklists app (apps/controls submodule) ──
  controls-pdf:
    build: apps/controls/services/pdf_renderer
    container_name: controls-pdf
    restart: unless-stopped
    networks:
      - backend

  controls-migrate:
    build: apps/controls
    container_name: controls-migrate
    # Every project database, not one shared one. No seed: a project's
    # checklists are the ones installed into it from the catalogue.
    command: >
      sh -c "until node scripts/migrate-projects.mjs; do s=$$?; [ $$s -eq 2 ] && exit 2; echo '[controls] waiting for postgres'; sleep 2; done"
    env_file: apps/controls/env.development
    depends_on:
      - postgres
      - platform
    restart: "no"
    networks:
      - backend

  controls-web:
    build:
      context: apps/controls
      args:
        NEXT_BASE_PATH: /controls
    container_name: controls-web
    env_file: apps/controls/env.development
    environment:
      # the server-side audit forwarder posts here (service name on the backend network, not localhost)
      AISC_BACKEND_URL: http://aisc-backend:8000
      # Who may be in this project, and who may change it. Asked once per
      # request by the middleware over /p/:path*.
      PLATFORM_URL: http://platform:8000
      # The catalogue: one, hosted online. In this dev stack its local copy
      # stands in for it. Server-side only: the install page fetches a control's
      # package here.
      CATALOGUE_URL: ${CATALOGUE_URL:-http://catalogue-backend:8000}
      # The hosted catalogue's bridge token, when it sets one. Empty locally.
      CATALOGUE_TOKEN: ${CATALOGUE_BRIDGE_TOKEN:-}
      # The catalogue's origin in the browser: the only page whose install
      # dialog may call /controls/api/install with the person's sign-in.
      CATALOGUE_ORIGIN: ${CATALOGUE_EXTERNAL_URL:-http://localhost:8102}
    depends_on:
      controls-migrate:
        condition: service_completed_successfully
      controls-pdf:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
      - frontend

  # Pre-fill a qualification from a document somebody already wrote. Reads the
  # file, proposes the form's answers, and hands them back for amending. Stores
  # nothing, and needs no model: the Annex headings and the usual labels are
  # the signal.
  qualification-prefill:
    build:
      # the app root, because the field mapping lives with the form
      context: apps/qualification
      dockerfile: services/prefill/Dockerfile
    image: aisc-qualification-prefill:latest
    pull_policy: never
    container_name: qualification-prefill
    restart: unless-stopped
    networks:
      - backend

  # ── EU-AI-Act qualification app (apps/qualification submodule) ──
  # LiteLLM completion sidecar — holds the provider key; the app calls it over HTTP.
  qualification-llm:
    build: apps/qualification/services/llm
    container_name: qualification-llm
    environment:
      # Default provider is Mistral; LiteLLM picks the key matching LLM_MODEL.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${QUALIFICATION_LLM_MODEL:-mistral/mistral-large-latest}
    restart: unless-stopped
    networks:
      - backend

  # The card agent: drafts the prose-fed nodes of an AI card (techniques, components) through the
  # LLM sidecar, and publishes the draft to qualification-web.
  qualification-agents:
    build:
      context: apps/qualification/services/agents
      dockerfile: Dockerfile.stack
      additional_contexts:
        ontology-prompts: apps/qualification/services/ontology/prompts
    image: aisc-qualification-agents:latest
    pull_policy: never
    container_name: qualification-agents
    environment:
      LLM_SERVICE_URL: http://qualification-llm:4000
      BAF_LLM_BASE_URL: http://qualification-llm:4000
      ONTOLOGY_SERVICE_URL: http://qualification-ontology:8011
      APP_URL: http://qualification-web:3000/qualification
    restart: unless-stopped
    networks:
      - backend

  # AIRO graph builder sidecar: turns a qualification's answers, the agent's
  # prose extraction and a reviewer's patch into the filled AIRO graph that IS
  # the system's AI card. Pure computation, no model: without it the app can
  # collect answers but cannot export a card, which is what step 2 reads.
  qualification-ontology:
    build:
      # The app root, because the picker vocabulary in src/data is shared with
      # the form, which is what its own Dockerfile says.
      context: apps/qualification
      dockerfile: services/ontology/Dockerfile
    container_name: qualification-ontology
    restart: unless-stopped
    networks:
      - backend

  # System-card PDF renderer sidecar.
  qualification-pdf:
    build: apps/qualification/services/system_card_renderer
    container_name: qualification-pdf
    restart: unless-stopped
    networks:
      - backend

  qualification-migrate:
    build: apps/qualification
    container_name: qualification-migrate
    command: >
      sh -c "until npx prisma migrate deploy; do echo '[qualification] waiting for postgres'; sleep 2; done"
    env_file: apps/qualification/env.development
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  qualification-web:
    build:
      context: apps/qualification
      args:
        NEXT_BASE_PATH: /qualification
    container_name: qualification-web
    environment:
      AISC_BACKEND_URL: http://aisc-backend:8000
      # The card agent, which the save starts and the card page polls.
      AGENT_SERVICE_URL: http://qualification-agents:8012
      # Where an uploaded document is turned into the form's answers.
      PREFILL_URL: http://qualification-prefill:8012
    # Migration is owned by qualification-migrate; the web container only serves.
    command: ["npx", "next", "start", "-p", "3000"]
    env_file: apps/qualification/env.development
    depends_on:
      qualification-migrate:
        condition: service_completed_successfully
      qualification-llm:
        condition: service_started
      qualification-pdf:
        condition: service_started
      qualification-ontology:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
      - frontend

  # ── AI Act control objectives (apps/control-objectives submodule) ──
  # Reads the AI Card the qualification app exports, ranks that system's risks
  # and maps them onto the control objectives. Keeps its own Postgres database:
  # the projects, their rankings and what each mapping run cost. Its tables
  # live in the `control_objectives` schema of the one platform database,
  # created by init/platform-db.sql; the migration makes the schema if a
  # database predates it.
  control-objectives-migrate:
    build: apps/control-objectives/
    image: aisc-control-objectives:latest
    pull_policy: never
    container_name: control-objectives-migrate
    command: >
      sh -c "until alembic upgrade head; do echo '[control-objectives] waiting for postgres'; sleep 2; done"
    environment:
      DATABASE_URL: ${CONTROL_OBJECTIVES_DATABASE_URL:-postgresql://control_objectives_rw:control_objectives_rw@postgres:5432/platform}
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  control-objectives:
    build: apps/control-objectives/
    image: aisc-control-objectives:latest
    pull_policy: never
    container_name: control-objectives
    env_file: apps/control-objectives/env.development
    volumes:
      # aisc_identity: who is calling, answered the same way by every Python
      # service. Mounted rather than copied, so one fix reaches all of them.
      - ./shared/identity:/app/shared/identity:ro,z
    environment:
      PYTHONPATH: /app/src:/app/shared/identity
      # A project belongs to the people in it, and this service holds somebody's
      # risk ratings, so it has to know who is asking.
      AUTH_ENABLED: "true"
      KEYCLOAK_ISSUER: ${KEYCLOAK_URL_EXTERNAL}/realms/aisc
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/aisc/protocol/openid-connect/certs
      # Served behind Caddy under /control-objectives. FastAPI's root_path only
      # fixes the URLs the app generates; Caddy's handle_path strips the prefix.
      CONTROL_OBJECTIVES_ROOT_PATH: /control-objectives
      # Where projects are chosen. Reached without one, this service sends the
      # reader there rather than asking a second time.
      LAUNCHER_URL: ${LAUNCHER_EXTERNAL_URL:-http://localhost:8100/}
      # "Start assessment" asks the platform for the latest AI card version and
      # qualification for that version's card, with the caller's own token.
      PLATFORM_URL: http://platform:8000
      QUALIFICATION_URL: http://qualification-web:3000/qualification
      DATABASE_URL: ${CONTROL_OBJECTIVES_DATABASE_URL:-postgresql://control_objectives_rw:control_objectives_rw@postgres:5432/platform}
      # The model, named BAF's way — the same two variables the qualification
      # filler reads, so both services are configured alike.
      #
      # The default is deliberately keyless: the service refuses to start if the
      # provider needs a key that is not set, so a first install must not default
      # to a hosted provider. `ollama` reaches a model on the host through
      # host.docker.internal. For a hosted provider set, in the platform env file:
      #   CONTROL_OBJECTIVES_LLM_PROVIDER=openai
      #   CONTROL_OBJECTIVES_LLM_MODEL=gpt-4o
      #   OPENAI_API_KEY=...        (never commit one)
      BAF_LLM_PROVIDER: ${CONTROL_OBJECTIVES_LLM_PROVIDER:-ollama}
      BAF_LLM_MODEL: ${CONTROL_OBJECTIVES_LLM_MODEL:-mistral:latest}
      BAF_LLM_BASE_URL: ${CONTROL_OBJECTIVES_LLM_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    # so the keyless default above can reach a model running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-objectives-migrate:
        condition: service_completed_successfully
    # No published port on purpose. It is served at /control-objectives through
    # Caddy, behind the gateway; publishing 8090 made the whole app reachable
    # with no authentication at all.
    expose:
      - "8090"
    networks:
      - backend
      - frontend
    restart: unless-stopped

  # ── Report (step 7): the composer assembles a report from blocks, the renderer renders it ──
  report-composer:
    build: apps/report-composer
    image: aisc-report-composer:latest
    pull_policy: never
    container_name: report-composer
    volumes:
      - ./shared/identity:/app/shared/identity:ro,z
    environment:
      PYTHONPATH: /app:/app/shared/identity
      AUTH_ENABLED: "true"
      KEYCLOAK_ISSUER: ${KEYCLOAK_URL_EXTERNAL}/realms/aisc
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/aisc/protocol/openid-connect/certs
      REPORT_COMPOSER_ROOT_PATH: /report-composer
      LAUNCHER_URL: ${LAUNCHER_EXTERNAL_URL:-http://localhost:8100/}
      PLATFORM_ORIGIN: ${PLATFORM_ORIGIN:-http://localhost}
      REPORT_COMPOSER_DATABASE_URL: postgresql://report_composer_rw:${REPORT_COMPOSER_PASSWORD:-report_composer_rw}@postgres:5432/platform
      REPORT_RENDERER_URL: http://report-renderer:8001
      REPORT_SERVICE_TOKEN: ${REPORT_SERVICE_TOKEN:?run scripts/secrets.sh first}
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      report-renderer:
        condition: service_started
    expose:
      - "8095"
    networks:
      - backend
      - frontend
    restart: unless-stopped

  report-renderer:
    build:
      context: ${REPORT_GENERATOR_DIR:-../aisc-report-generator}
      additional_contexts:
        interface: ${REPORT_INTERFACE_DIR:-../aisc-report-plugin-interface}
        mlareject: ${REPORT_MLAREJECT_DIR:-../aisc-report-mlareject}
    image: aisc-report-renderer:latest
    pull_policy: never
    container_name: report-renderer
    volumes:
      # read-only, never copied (02 D3; airo_vocab.json is pinned by the guard)
      - ./apps/qualification/src/data/airo_vocab.json:/data/airo_vocab.json:ro,z
      - ./apps/control-objectives/src/aisc_control_objectives/data/ai_act_control_objectives.csv:/data/ai_act_control_objectives.csv:ro,z
    environment:
      REPORT_PLATFORM_DATABASE_URL: postgresql://report_ro:${REPORT_RO_PASSWORD:-report_ro}@postgres:5432/platform
      REPORT_SUPERSET_DATABASE_URL: postgresql://report_ro:${REPORT_RO_PASSWORD:-report_ro}@postgres:5432/superset
      REPORT_PROJECT_DB_URL: postgresql://report_ro:${REPORT_RO_PASSWORD:-report_ro}@postgres:5432/{database}
      REPORT_AIRO_VOCAB_PATH: /data/airo_vocab.json
      REPORT_OBJECTIVES_CSV_PATH: /data/ai_act_control_objectives.csv
      REPORT_SERVICE_TOKEN: ${REPORT_SERVICE_TOKEN:?run scripts/secrets.sh first}
      # O1: chart images stay off until Superset screenshots are enabled (set to superset then)
      REPORT_CHART_IMAGES: "off"
      REPORT_SUPERSET_PUBLIC_URL: ${DASHBOARD_EXTERNAL_URL:-http://localhost:8188}
    depends_on:
      report-grants:
        condition: service_completed_successfully
    # called by the composer only: not on the frontend network, not in the Caddyfile
    expose:
      - "8001"
    networks:
      - backend
    restart: unless-stopped

  # SELECT for report_ro on what the report reads, again on every start (02 D6 (b)(c))
  report-grants:
    image: postgres:14-alpine
    container_name: report-grants
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      REPORT_GRANTS_WAIT_SECONDS: "600"
    volumes:
      - ./scripts/report-grants.sh:/setup/report-grants.sh:ro,Z
      - ./init/report-ro-grants.sql:/setup/report-ro-grants.sql:ro,Z
    command: ["sh", "/setup/report-grants.sh"]
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
      qualification-migrate:
        condition: service_completed_successfully
      control-objectives-migrate:
        condition: service_completed_successfully
      controls-migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - backend

  # ── Results dashboard (apps/results-dashboard submodule) ──
  # Superset, reading the platform's own database read-only, so the evaluation
  # results the execution engine writes can be charted. Unlike the other apps it
  # cannot be served under a path prefix: Superset 4.1 needs the site root, so
  # it gets its own published port rather than a Caddy route.
  #
  # It shares the platform's Postgres, Redis and immudb instead of bringing its
  # own, which is what its standalone docker-compose.yml does. Its metadata DB
  # and its read-only role are created by init/50-superset-db.sql and
  # init/60-dashboard-ro.sql on a fresh volume.
  dashboard-migrate:
    build: apps/results-dashboard
    image: aisc-results-dashboard:latest
    pull_policy: never
    container_name: dashboard-migrate
    user: root
    entrypoint: ["/bin/bash", "-c"]
    # A single argument to `bash -c`: a plain string command is split on
    # whitespace and truncated at the first &&, which loses the rest.
    command:
      # No local admin account: people sign in at the gateway, and Superset takes
      # who they are from it (dashboard-gateway/). The platform's admin is
      # Superset's Admin through the role sync.
      - "superset db upgrade && superset init"
    environment: &dashboard-env
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?run scripts/secrets.sh first}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      IMMUDB_HOST: immudb
      IMMUDB_PORT: "3322"
      IMMUDB_USER: immudb
      IMMUDB_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
      AISC_AUDIT_ENABLED: "true"
      # the platform's own database, through the read-only role
      AISC_RESULTS_DB_URI: ${AISC_RESULTS_DB_URI:-postgresql+psycopg2://dashboard_ro:dashboard_ro@postgres:5432/platform}
      LAUNCHER_URL: ${LAUNCHER_EXTERNAL_URL:-http://localhost:8100/}
      BRANDING_APP_NAME: ${BRANDING_APP_NAME:-}
      BRANDING_LOGO: ${BRANDING_LOGO:-}
      BRANDING_PRIMARY: ${BRANDING_PRIMARY:-}
      BRANDING_SECONDARY: ${BRANDING_SECONDARY:-}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
    volumes: &dashboard-volumes
      - ./apps/results-dashboard/superset_config.py:/app/pythonpath/superset_config.py:ro,Z
      - ./apps/results-dashboard/aisc_ext:/app/pythonpath/aisc_ext:ro,Z
      - ./apps/results-dashboard/branding:/app/superset/static/assets/branding:ro,Z
    depends_on:
      - postgres
      - redis
    restart: "no"
    networks:
      - backend

  dashboard:
    build: apps/results-dashboard
    image: aisc-results-dashboard:latest
    pull_policy: never
    container_name: dashboard
    # network_mode: host, for one reason: Superset authenticates itself, so it
    # fetches the OIDC metadata server-side and then sends the BROWSER to the
    # same issuer. Those two have to be the same string, and the only string
    # that works for both is http://localhost:8081 -- inside a bridge network
    # `localhost` would be this container. It is also the one origin Keycloak
    # exempts from marking its cookies Secure, which is what lets the session be
    # shared over plain HTTP.
    #
    # Consequences of host networking, all deliberate: it listens on
    # DASHBOARD_PORT directly (the stock entrypoint honours SUPERSET_PORT), and
    # it reaches Postgres, Redis and immudb on their published host ports.
    network_mode: host
    # Superset no longer logs anybody in: it sits behind the gateway like every
    # other module. Caddy serves it on DASHBOARD_PORT after the one sign-in; the
    # server itself listens only on the Docker host address, reachable from this
    # machine's containers (Caddy, the platform's bridge) and not the network.
    volumes:
      - ./apps/results-dashboard/superset_config.py:/app/pythonpath/superset_config.py:ro,Z
      - ./apps/results-dashboard/aisc_ext:/app/pythonpath/aisc_ext:ro,Z
      - ./apps/results-dashboard/branding:/app/superset/static/assets/branding:ro,Z
      - ./dashboard-gateway:/app/pythonpath_gateway:ro,Z
    environment:
      <<: *dashboard-env
      SUPERSET_BIND_ADDRESS: ${DASHBOARD_BIND_ADDRESS:-172.17.0.1}
      SUPERSET_PORT: ${DASHBOARD_INTERNAL_PORT:-8189}
      # the dashboard's own config, run unchanged, then who is signed in taken
      # from the gateway's verified token
      SUPERSET_CONFIG_PATH: /app/pythonpath_gateway/superset_gateway_config.py
      GATEWAY_TOKEN_ISSUER: ${KEYCLOAK_URL_EXTERNAL}/realms/aisc
      GATEWAY_JWKS_URL: ${KEYCLOAK_URL_EXTERNAL}/realms/aisc/protocol/openid-connect/certs
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/superset
      AISC_RESULTS_DB_URI: ${AISC_RESULTS_DB_URI:-postgresql+psycopg2://dashboard_ro:dashboard_ro@localhost:5432/platform}
      LAUNCHER_URL: ${LAUNCHER_EXTERNAL_URL:-http://localhost:8100/}
      REDIS_HOST: localhost
      IMMUDB_HOST: localhost
      # its own Keycloak login stays off: the gateway signs people in
      AISC_OAUTH: "0"
      # the shared secret the platform sends to /api/v1/aisc_project (the bridge)
      DASHBOARD_BRIDGE_TOKEN: ${DASHBOARD_BRIDGE_TOKEN:-}
      # where a project's own database is, as this host-network container sees it
      AISC_PROJECT_DB_HOSTPORT: localhost:5432
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Publishes the bundled plugins to the index at bring-up.
  #
  # Without this the index is empty on a fresh install and nothing can be
  # installed from the catalogue, which is the only route in now that the engine
  # no longer pre-loads def_plugins. Idempotent: twine skips what is already
  # there, so a restart republishes nothing.
  plugin-publisher:
    image: python:3.12-slim
    container_name: plugin-publisher
    working_dir: /src
    volumes:
      - ./def_plugins:/src:ro
    environment:
      TWINE_USERNAME: ${PACKAGE_REGISTRY_USER:-root}
      TWINE_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD:-}
      TWINE_REPOSITORY_URL: ${PACKAGE_REGISTRY_URL:-http://devpi:3141}/${PACKAGE_REGISTRY_INDEX:-root/public}/
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "pip install --quiet build twine && out=$$(mktemp -d) && for d in /src/*/; do [ -f \"$$d/pyproject.toml\" ] || continue; python -m build --outdir $$out \"$$d\" >/dev/null 2>&1 || { echo \"could not build $$d\"; continue; }; done && twine upload --non-interactive $$out/* && echo 'plugins published to the index'"
    depends_on:
      - devpi
    restart: "no"
    networks:
      - backend

  # ── The platform's own projects (platform/) ──
  # One project, defined once, that every module will come to reference. Today
  # it owns a single table and the launcher lists it; the modules still keep
  # their own databases and are wired to it one at a time.
  #
  # No authorisation here on purpose: the gateway has already authenticated the
  # request, and for now every account may see every project.
  platform:
    build: platform
    image: aisc-platform:latest
    pull_policy: never
    container_name: platform
    volumes:
      # aisc_identity: who is calling, answered the same way by every Python
      # service. Mounted rather than copied, so one fix reaches all of them.
      - ./shared/identity:/app/shared/identity:ro,z
      # core is this service's to migrate, and the files are read at startup.
      - ./platform/migrations:/app/migrations:ro,z
      # what every new project database starts with, one file per module
      - ./platform/project-template:/app/project-template:ro,z
    environment:
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql://platform_rw:platform_rw@postgres:5432/platform}
      PYTHONPATH: /app/shared/identity
      # A project belongs to the people in it, so this service has to know who
      # is asking. Verified here rather than taken on the gateway's word.
      AUTH_ENABLED: "true"
      KEYCLOAK_ISSUER: ${KEYCLOAK_URL_EXTERNAL}/realms/aisc
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/aisc/protocol/openid-connect/certs
      # Who owns the projects that predate membership. Keycloak's subjects for
      # the two seeded accounts; the realm file pins these ids, so they are the
      # same on every install made from it. Only projects with nobody in them
      # are touched, so this is a one-off that keeps being harmless.
      PLATFORM_BOOTSTRAP_OWNERS: ${PLATFORM_BOOTSTRAP_OWNERS:-c8134e20-7078-465a-8955-f25289bd4540,9feeffe8-6e06-49c8-a7ae-c8993a1e68d4}
      # Making or deleting a project tells the dashboard's bridge, which makes or
      # removes that project's dashboard. The dashboard runs on the host network
      # (see its service), on DASHBOARD_PORT. The token is the shared secret the
      # bridge checks; with none set, the bridge refuses every call.
      # straight to Superset, not through Caddy: the bridge has its own token and no session
      DASHBOARD_BRIDGE_URL: http://host.docker.internal:${DASHBOARD_INTERNAL_PORT:-8189}
      DASHBOARD_BRIDGE_TOKEN: ${DASHBOARD_BRIDGE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      postgres-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend
      - frontend

  # ── Catalogue of tests and controls (apps/catalogue submodule) ──
  # Step 3 of the assessment: browse the registry and choose what will run. On
  # this branch it also carries one-click install: the catalogue resolves a tool
  # to a package on its own index and posts it to the platform's install door.
  devpi:
    build: apps/catalogue/devpi
    image: aisc-catalogue-devpi:latest
    pull_policy: never
    container_name: devpi
    environment:
      DEVPI_INDEX: ${DEVPI_INDEX:-root/public}
      DEVPI_ROOT_PASSWORD: ${DEVPI_ROOT_PASSWORD:-}
    volumes:
      - devpi_data:/data
    restart: unless-stopped
    networks:
      - backend

  # The catalogue's schema comes from its migration history, like every other
  # module's, and the service waits for it rather than creating tables itself.
  catalogue-migrate:
    build: apps/catalogue/backend
    image: aisc-catalogue-backend:latest
    pull_policy: never
    container_name: catalogue-migrate
    command: >
      sh -c "until uv run alembic upgrade head; do echo '[catalogue] waiting for postgres'; sleep 2; done"
    environment:
      DATABASE_URL: ${CATALOGUE_DATABASE_URL:-postgresql+psycopg://catalogue_rw:catalogue_rw@postgres:5432/platform}
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  catalogue-backend:
    build: apps/catalogue/backend
    image: aisc-catalogue-backend:latest
    pull_policy: never
    container_name: catalogue-backend
    volumes:
      # aisc_identity: who is calling, answered the same way by every Python
      # service. Mounted rather than copied, so one fix reaches all of them.
      - ./shared/identity:/app/shared/identity:ro,z
    environment:
      # One database for the whole platform; the catalogue owns the `catalogue`
      # schema in it and connects as its own role. It holds reference data, the
      # same for every project, so nothing in it belongs to one.
      DATABASE_URL: ${CATALOGUE_DATABASE_URL:-postgresql+psycopg://catalogue_rw:catalogue_rw@postgres:5432/platform}
      PYTHONPATH: /app/shared/identity
      # Changing the catalogue takes the admin role: the engine installs what is
      # listed here and then runs it. Verified against Keycloak rather than
      # taken on the gateway's word, the same as the engine does.
      AUTH_ENABLED: "true"
      KEYCLOAK_ISSUER: ${KEYCLOAK_URL_EXTERNAL}/realms/aisc
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/aisc/protocol/openid-connect/certs
      # the index the install descriptor advertises to the platform
      DEVPI_URL: http://devpi:3141
      DEVPI_INDEX: ${DEVPI_INDEX:-root/public}
      # the controls app, for the per-tab "installed" counts
      CONTROLS_APP_URL: http://controls-web:3000/controls
      LLM_MODEL: ${CATALOGUE_LLM_MODEL:-mistral/mistral-large-latest}
      LLM_MISTRAL_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      catalogue-migrate:
        condition: service_completed_successfully
      devpi:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
      - frontend

  catalogue-frontend:
    build:
      context: apps/catalogue/frontend
      args:
        # same-origin: Caddy serves this app and proxies /api to the backend
        VITE_API_URL: ${CATALOGUE_EXTERNAL_URL:-http://localhost:8102}/api
        VITE_ENABLE_ADD_ENTRIES: "true"
        VITE_ENABLE_SANDBOX: "true"
        # without this the Install button does not render at all
        VITE_ENABLE_INSTALL: "true"
    image: aisc-catalogue-frontend:latest
    pull_policy: never
    container_name: catalogue-frontend
    depends_on:
      - catalogue-backend
    restart: unless-stopped
    networks:
      - frontend
