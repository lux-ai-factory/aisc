services:
  # # Frontend development container
  aisc-webapp:
    build: apps/webapp/
    image: aisc-webapp:latest
    pull_policy: never
    container_name: aisc-webapp
    environment:
      APP_API_URL: ${API_URL_EXTERNAL}
      APP_SHOW_PLUGIN_VISUALIZATION: ${SHOW_PLUGIN_VISUALIZATION}
      # Keycloak URL injected into the built JS at container start (env.sh replaces APP_KEYCLOAK_URL).
      APP_KEYCLOAK_URL: ${KEYCLOAK_URL_EXTERNAL}
    depends_on:
      - aisc-backend
    networks:
      - frontend

  aisc-backend:
    build: apps/backend/
    image: aisc-backend:latest
    pull_policy: never
    container_name: aisc-backend
    environment:
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET}
      S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET}
      S3_URL: ${S3_URL}
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_ENGINE: ${DB_ENGINE}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS}
      BACKEND_CSRF_TRUSTED_ORIGINS: ${BACKEND_CSRF_TRUSTED_ORIGINS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ENABLE_SSL_PROXY: true
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      PLUGIN_PATH: ${PLUGIN_PATH}
      PACKAGE_REGISTRY_URL: ${PACKAGE_REGISTRY_URL}
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX}
      # immudb audit ledger — inside docker the host is the SERVICE NAME, not localhost.
      IMMUDB_URL: immudb:3322
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # the catalogue's one-click install door (apps/backend on this branch):
      # off unless enabled, refuses anything but the trusted index, and requires
      # the bearer token the catalogue frontend is built with.
      CATALOGUE_INSTALL_ENABLED: ${CATALOGUE_INSTALL_ENABLED:-true}
      CATALOGUE_INSTALL_TOKEN: ${CATALOGUE_INSTALL_TOKEN:-}
      CATALOGUE_TRUSTED_INDEXES: ${CATALOGUE_TRUSTED_INDEXES:-http://devpi:3141/root/public/+simple/}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      immudb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:z
      - ./shared:/app/shared:z
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && uv run manage.py migrate --noinput 
      && uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --no-access-log"

  #
  aisc-eval-worker:
    platform: linux/amd64
    build:
      context: apps/eval/
    image: aisc-eval:latest
    pull_policy: never
    container_name: aisc-eval-worker
    # volumes:
    #   - ./eval-logging.yaml:/app/config/logging.yaml:ro
    environment:
      API_URL: ${API_URL} # Address of api-backend
      API_PREFIX: ${API_PREFIX}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      PLUGIN_PATH: ${PLUGIN_PATH}
      PACKAGE_REGISTRY_URL: ${PACKAGE_REGISTRY_URL}
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    depends_on:
      - aisc-backend
      - rabbitmq
      - redis
    networks:
      - backend
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:z
      - ./shared:/app/shared:z
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && celery -A aisc_eval.celery_worker worker --loglevel=debug"

  aisc-eval-flower:
    platform: linux/amd64
    image: aisc-eval:latest
    pull_policy: never
    container_name: aisc-eval-flower
    # volumes:
    #   - ./eval-logging.yaml:/app/config/logging.yaml:ro
    environment:
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      FLOWER_URL_PREFIX: flower
    depends_on:
      - aisc-eval-worker
      - aisc-backend
      - rabbitmq
      - redis
    volumes:
      - ${PLUGIN_PATH}:/app/plugins
      - ./shared:/app/shared
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && celery -A aisc_eval.celery_worker flower"
    healthcheck:
      test:
        - "CMD-SHELL"
        - celery --app aisc_eval.celery_app inspect ping -d "celery@$$HOSTNAME"
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # ── AI-compliance checklists app (apps/controls submodule) ──
  controls-pdf:
    build: apps/controls/services/pdf_renderer
    container_name: controls-pdf
    restart: unless-stopped
    networks:
      - backend

  controls-migrate:
    build: apps/controls
    container_name: controls-migrate
    command: >
      sh -c "until npx prisma migrate deploy; do echo '[controls] waiting for postgres'; sleep 2; done && npx prisma db seed"
    env_file: apps/controls/env.development
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  controls-web:
    build:
      context: apps/controls
      args:
        NEXT_BASE_PATH: /controls
    container_name: controls-web
    env_file: apps/controls/env.development
    environment:
      # the server-side audit forwarder posts here (service name on the backend network, not localhost)
      AISC_BACKEND_URL: http://aisc-backend:8000
    depends_on:
      controls-migrate:
        condition: service_completed_successfully
      controls-pdf:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
      - frontend

  # ── EU-AI-Act qualification app (apps/qualification submodule) ──
  # LiteLLM completion sidecar — holds the provider key; the app calls it over HTTP.
  qualification-llm:
    build: apps/qualification/services/llm
    container_name: qualification-llm
    environment:
      # Default provider is Mistral; LiteLLM picks the key matching LLM_MODEL.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${QUALIFICATION_LLM_MODEL:-mistral/mistral-large-latest}
    restart: unless-stopped
    networks:
      - backend

  # System-card PDF renderer sidecar.
  qualification-pdf:
    build: apps/qualification/services/system_card_renderer
    container_name: qualification-pdf
    restart: unless-stopped
    networks:
      - backend

  qualification-migrate:
    build: apps/qualification
    container_name: qualification-migrate
    command: >
      sh -c "until npx prisma migrate deploy; do echo '[qualification] waiting for postgres'; sleep 2; done"
    env_file: apps/qualification/env.development
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  qualification-web:
    build:
      context: apps/qualification
      args:
        NEXT_BASE_PATH: /qualification
    container_name: qualification-web
    environment:
      AISC_BACKEND_URL: http://aisc-backend:8000
    # Migration is owned by qualification-migrate; the web container only serves.
    command: ["npx", "next", "start", "-p", "3000"]
    env_file: apps/qualification/env.development
    depends_on:
      qualification-migrate:
        condition: service_completed_successfully
      qualification-llm:
        condition: service_started
      qualification-pdf:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
      - frontend

  # ── AI Act control objectives (apps/control-objectives submodule) ──
  # Reads the AI Card the qualification app exports, ranks that system's risks
  # and maps them onto the control objectives. Keeps its own Postgres database:
  # the projects, their rankings and what each mapping run cost. The database is
  # created on a fresh volume by init/control-objectives-db.sql.
  control-objectives-migrate:
    build: apps/control-objectives/
    image: aisc-control-objectives:latest
    pull_policy: never
    container_name: control-objectives-migrate
    command: >
      sh -c "until alembic upgrade head; do echo '[control-objectives] waiting for postgres'; sleep 2; done"
    environment:
      DATABASE_URL: ${CONTROL_OBJECTIVES_DATABASE_URL:-postgresql://aisc-postgres-user:dev-password@postgres:5432/control_objectives}
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  control-objectives:
    build: apps/control-objectives/
    image: aisc-control-objectives:latest
    pull_policy: never
    container_name: control-objectives
    env_file: apps/control-objectives/env.development
    environment:
      # Served behind Caddy under /control-objectives. FastAPI's root_path only
      # fixes the URLs the app generates; Caddy's handle_path strips the prefix.
      CONTROL_OBJECTIVES_ROOT_PATH: /control-objectives
      DATABASE_URL: ${CONTROL_OBJECTIVES_DATABASE_URL:-postgresql://aisc-postgres-user:dev-password@postgres:5432/control_objectives}
      # The model, named BAF's way — the same two variables the qualification
      # filler reads, so both services are configured alike.
      #
      # The default is deliberately keyless: the service refuses to start if the
      # provider needs a key that is not set, so a first install must not default
      # to a hosted provider. `ollama` reaches a model on the host through
      # host.docker.internal. For a hosted provider set, in the platform env file:
      #   CONTROL_OBJECTIVES_LLM_PROVIDER=openai
      #   CONTROL_OBJECTIVES_LLM_MODEL=gpt-4o
      #   OPENAI_API_KEY=...        (never commit one)
      BAF_LLM_PROVIDER: ${CONTROL_OBJECTIVES_LLM_PROVIDER:-ollama}
      BAF_LLM_MODEL: ${CONTROL_OBJECTIVES_LLM_MODEL:-mistral:latest}
      BAF_LLM_BASE_URL: ${CONTROL_OBJECTIVES_LLM_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    # so the keyless default above can reach a model running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-objectives-migrate:
        condition: service_completed_successfully
    # No published port on purpose. It is served at /control-objectives through
    # Caddy, behind the gateway; publishing 8090 made the whole app reachable
    # with no authentication at all.
    expose:
      - "8090"
    networks:
      - backend
      - frontend
    restart: unless-stopped

  # ── Results dashboard (apps/results-dashboard submodule) ──
  # Superset, reading the platform's own database read-only, so the evaluation
  # results the execution engine writes can be charted. Unlike the other apps it
  # cannot be served under a path prefix: Superset 4.1 needs the site root, so
  # it gets its own published port rather than a Caddy route.
  #
  # It shares the platform's Postgres, Redis and immudb instead of bringing its
  # own, which is what its standalone docker-compose.yml does. Its metadata DB
  # and its read-only role are created by init/50-superset-db.sql and
  # init/60-dashboard-ro.sql on a fresh volume.
  dashboard-migrate:
    build: apps/results-dashboard
    image: aisc-results-dashboard:latest
    pull_policy: never
    container_name: dashboard-migrate
    user: root
    entrypoint: ["/bin/bash", "-c"]
    # A single argument to `bash -c`: a plain string command is split on
    # whitespace and truncated at the first &&, which loses the rest.
    command:
      - "superset db upgrade && (superset fab create-admin --username ${DASHBOARD_ADMIN:-admin} --firstname Admin --lastname User --email admin@example.com --password ${DASHBOARD_ADMIN_PASSWORD:-admin} || true) && superset init"
    environment: &dashboard-env
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-aisc-dev-secret-change-me}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      IMMUDB_HOST: immudb
      IMMUDB_PORT: "3322"
      IMMUDB_USER: immudb
      IMMUDB_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
      AISC_AUDIT_ENABLED: "true"
      # the platform's own database, through the read-only role
      AISC_RESULTS_DB_URI: ${AISC_RESULTS_DB_URI:-postgresql+psycopg2://dashboard_ro:dashboard_ro@postgres:5432/aisc}
      BRANDING_APP_NAME: ${BRANDING_APP_NAME:-}
      BRANDING_LOGO: ${BRANDING_LOGO:-}
      BRANDING_PRIMARY: ${BRANDING_PRIMARY:-}
      BRANDING_SECONDARY: ${BRANDING_SECONDARY:-}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}
    volumes: &dashboard-volumes
      - ./apps/results-dashboard/superset_config.py:/app/pythonpath/superset_config.py:ro,Z
      - ./apps/results-dashboard/aisc_ext:/app/pythonpath/aisc_ext:ro,Z
      - ./apps/results-dashboard/branding:/app/superset/static/assets/branding:ro,Z
    depends_on:
      - postgres
      - redis
    restart: "no"
    networks:
      - backend

  dashboard:
    build: apps/results-dashboard
    image: aisc-results-dashboard:latest
    pull_policy: never
    container_name: dashboard
    volumes: *dashboard-volumes
    # network_mode: host, for one reason: Superset authenticates itself, so it
    # fetches the OIDC metadata server-side and then sends the BROWSER to the
    # same issuer. Those two have to be the same string, and the only string
    # that works for both is http://localhost:8081 -- inside a bridge network
    # `localhost` would be this container. It is also the one origin Keycloak
    # exempts from marking its cookies Secure, which is what lets the session be
    # shared over plain HTTP.
    #
    # Consequences of host networking, all deliberate: it listens on
    # DASHBOARD_PORT directly (the stock entrypoint honours SUPERSET_PORT), and
    # it reaches Postgres, Redis and immudb on their published host ports.
    network_mode: host
    environment:
      <<: *dashboard-env
      SUPERSET_PORT: ${DASHBOARD_PORT:-8188}
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/superset
      AISC_RESULTS_DB_URI: ${AISC_RESULTS_DB_URI:-postgresql+psycopg2://dashboard_ro:dashboard_ro@localhost:5432/aisc}
      REDIS_HOST: localhost
      IMMUDB_HOST: localhost
      # its own client in the realm; the browser and this container both use
      # this exact issuer string
      AISC_OAUTH: ${DASHBOARD_OAUTH:-1}
      OIDC_ISSUER: ${KEYCLOAK_URL_EXTERNAL}/realms/aisc
      OIDC_CLIENT_ID: ${DASHBOARD_OIDC_CLIENT_ID:-superset}
      OIDC_CLIENT_SECRET: ${DASHBOARD_OIDC_CLIENT_SECRET:-__DASHBOARD_OIDC_CLIENT_SECRET__}
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Catalogue of tests and controls (apps/catalogue submodule) ──
  # Step 3 of the assessment: browse the registry and choose what will run. On
  # this branch it also carries one-click install: the catalogue resolves a tool
  # to a package on its own index and posts it to the platform's install door.
  devpi:
    build: apps/catalogue/devpi
    image: aisc-catalogue-devpi:latest
    pull_policy: never
    container_name: devpi
    environment:
      DEVPI_INDEX: ${DEVPI_INDEX:-root/public}
      DEVPI_ROOT_PASSWORD: ${DEVPI_ROOT_PASSWORD:-}
    volumes:
      - devpi_data:/data
    restart: unless-stopped
    networks:
      - backend

  catalogue-backend:
    build: apps/catalogue/backend
    image: aisc-catalogue-backend:latest
    pull_policy: never
    container_name: catalogue-backend
    environment:
      DATABASE_URL: sqlite:///./data/Class_Diagram.db
      # the index the install descriptor advertises to the platform
      DEVPI_URL: http://devpi:3141
      DEVPI_INDEX: ${DEVPI_INDEX:-root/public}
      # the controls app, for the per-tab "installed" counts
      CONTROLS_APP_URL: http://controls-web:3000/controls
      LLM_MODEL: ${CATALOGUE_LLM_MODEL:-mistral/mistral-large-latest}
      LLM_MISTRAL_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - catalogue_sqlite:/app/data
    depends_on:
      - devpi
    restart: unless-stopped
    networks:
      - backend
      - frontend

  catalogue-frontend:
    build:
      context: apps/catalogue/frontend
      args:
        # same-origin: Caddy serves this app and proxies /api to the backend
        VITE_API_URL: ${CATALOGUE_EXTERNAL_URL:-http://localhost:8102}/api
        VITE_ENABLE_ADD_ENTRIES: "true"
        VITE_ENABLE_SANDBOX: "true"
        # without this the Install button does not render at all
        VITE_ENABLE_INSTALL: "true"
        # one-click install: the platform's install door and its token
        # the catalogue's own origin: its install POST is same-origin, so the
        # gateway session cookie travels with it (see the Caddyfile)
        VITE_PLATFORM_URL: ${CATALOGUE_EXTERNAL_URL:-http://localhost:8102}
        VITE_PLATFORM_INSTALL_TOKEN: ${CATALOGUE_INSTALL_TOKEN:-}
    image: aisc-catalogue-frontend:latest
    pull_policy: never
    container_name: catalogue-frontend
    depends_on:
      - catalogue-backend
    restart: unless-stopped
    networks:
      - frontend
