services:
  # # Frontend development container
  aisc-webapp:
    build: apps/webapp/
    image: aisc-webapp:latest
    pull_policy: never
    container_name: aisc-webapp
    environment:
      APP_API_URL: ${API_URL_EXTERNAL}
      APP_SHOW_PLUGIN_VISUALIZATION: ${SHOW_PLUGIN_VISUALIZATION}
      APP_SHOW_CELERY_TASKS: ${SHOW_CELERY_TASKS}
      # Auth toggle injected into the built JS at container start (env.sh replaces APP_AUTH_ENABLED).
      APP_AUTH_ENABLED: ${AUTH_ENABLED}
      # Keycloak URL injected into the built JS at container start (env.sh replaces APP_KEYCLOAK_URL).
      APP_KEYCLOAK_URL: ${KEYCLOAK_URL_EXTERNAL}
      # Public catalogue URL injected into the built JS at container start (env.sh replaces APP_CATALOG_URL).
      APP_CATALOG_URL: ${CATALOG_URL}
    depends_on:
      - aisc-backend
    networks:
      - frontend

  aisc-backend:
    build: apps/backend/
    image: aisc-backend:latest
    pull_policy: never
    container_name: aisc-backend
    environment:
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET}
      S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET}
      S3_URL: ${S3_URL}
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_ENGINE: ${DB_ENGINE}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS}
      BACKEND_CSRF_TRUSTED_ORIGINS: ${BACKEND_CSRF_TRUSTED_ORIGINS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ENABLE_SSL_PROXY: true
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      PLUGIN_PATH: ${PLUGIN_PATH}
      PACKAGE_REGISTRY_URL: ${PACKAGE_REGISTRY_URL}
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX}
      # immudb audit ledger — inside docker the host is the SERVICE NAME, not localhost.
      IMMUDB_URL: immudb:3322
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Keycloak bearer auth for the API (settings.py reads these).
      AUTH_ENABLED: ${AUTH_ENABLED}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      # Keycloak Admin REST client (WP7): service-account client the backend
      # uses to manage users/roles; empty secret = admin surface off.
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-http://keycloak:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aisc}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-aisc-backend-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      MODEL_LISTING_SSL_VERIFY: ${MODEL_LISTING_SSL_VERIFY}
      # Qualification and the Report service are required; the backend calls them directly by
      # container name on the backend network. The report service draws the JSON snapshot the
      # backend assembles (services/report_service.py -> REPORT_SERVICE_URL/api/generate).
      QUALIFICATION_SERVICE_URL: http://qualification:8000
      REPORT_SERVICE_URL: http://report:8080
      FLOWER_SERVICE_URL: http://caddy:8080/internal/flower
      SERVICE_TOKEN_FOR_APPS: ${BACKEND_TO_QUALIFICATION_TOKEN}
      # Hosted controls catalogue API; read by `sync_controls_catalogue` to
      # populate the checklist tables (was a vendored seed before).
      CONTROLS_CATALOG_URL: ${CONTROLS_CATALOG_URL:-https://sandboxconfigurator.aifactory.lu/api/api}
    # Resolves host.docker.internal to the host on Linux (Engine >= 20.10);
    # harmless no-op on Docker Desktop (macOS/Windows) where it already works.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      immudb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      qualification:
        condition: service_started
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:z
      - ./shared:/app/shared:z
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && uv run manage.py migrate --noinput 
      && uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --no-access-log"

  #
  aisc-eval-worker:
    platform: linux/amd64
    build:
      context: apps/eval/
    image: aisc-eval:latest
    pull_policy: never
    container_name: aisc-eval-worker
    # volumes:
    #   - ./eval-logging.yaml:/app/config/logging.yaml:ro
    environment:
      API_URL: ${API_URL} # Address of api-backend
      API_PREFIX: ${API_PREFIX}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      PLUGIN_PATH: ${PLUGIN_PATH}
      PACKAGE_REGISTRY_URL: ${PACKAGE_REGISTRY_URL}
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    # host.docker.internal (PACKAGE_REGISTRY_URL) on Linux hosts; no-op on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aisc-backend
      - rabbitmq
      - redis
    networks:
      - backend
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:z
      - ./shared:/app/shared:z
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && celery -A aisc_eval.celery_worker worker --loglevel=debug"
    # Healthy = this worker is online on the broker. The image's own HEALTHCHECK
    # pings "celery@$$HOSTNAME" (a shell PID once `$$` is expanded) which never
    # matches a node name, so it is overridden here to ping any node of the app.
    healthcheck:
      test:
        - "CMD-SHELL"
        - celery --app aisc_eval.celery_app inspect ping --timeout 5
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  aisc-eval-flower:
    platform: linux/amd64
    image: aisc-eval:latest
    pull_policy: never
    container_name: aisc-eval-flower
    # volumes:
    #   - ./eval-logging.yaml:/app/config/logging.yaml:ro
    environment:
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      FLOWER_URL_PREFIX: flower
      FLOWER_UNAUTHENTICATED_API: "true"
    depends_on:
      - aisc-eval-worker
      - aisc-backend
      - rabbitmq
      - redis
    volumes:
      - ${PLUGIN_PATH}:/app/plugins
      - ./shared:/app/shared
      - flower_data:/data
    command: >
      sh -c "uv pip install --no-deps -e /app/shared/plugin-manager -e /app/shared/plugin-interface 
      && celery -A aisc_eval.celery_worker flower --db=/data/flower.db --persistent=True"
    healthcheck:
      test:
        - "CMD-SHELL"
        # no node named "celery@<this container's hostname>" exists on flower, so
        # ping any node of the app instead of the old -d "celery@$$HOSTNAME"
        - celery --app aisc_eval.celery_app inspect ping --timeout 5
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # Qualification service: answers in, AI card out. Stateless —
  # the backend owns all qualification data; this is only the compute.
  # Default in dev: it owns the builtin default questionnaire
  # (src/default_questionnaire.py), which the backend proxies from here.
  qualification:
    # Build from the app root so the vendored AIRO builder (airo_min + airo
    # ttl) and the shared src/data vocabs resolve into the image.
    build:
      context: apps/qualification
      dockerfile: Dockerfile
    container_name: aisc-qualification
    environment:
      BACKEND_TO_QUALIFICATION_TOKEN: ${BACKEND_TO_QUALIFICATION_TOKEN:-}
      # the system's IR node in generated cards; deployment-specific, never a
      # hardcoded host (unset -> a local urn:aisc:project in the service)
      AISC_SYSTEM_IRI: ${AISC_SYSTEM_IRI:-}
    restart: unless-stopped
    networks:
      - backend

  # The Report microservice (apps/report): ONE lean server. The backend (Django) owns all data and
  # hands it over as a JSON snapshot (services/report_snapshot.py); this service only draws the
  # document (HTML/PDF) from that snapshot and reads no database. Backend-network only, :8080.
  report:
    build: apps/report
    image: aisc-report:latest
    pull_policy: never
    container_name: aisc-report
    environment:
      # shared service token: the backend sends it as X-AISC-Service-Token (SERVICE_TOKEN_FOR_APPS)
      REPORT_SERVICE_TOKEN: ${BACKEND_TO_QUALIFICATION_TOKEN:-dev-report-token}
    restart: unless-stopped
    networks:
      - backend
    expose:
      - "8080"

volumes:
  flower_data:
