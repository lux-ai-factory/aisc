engine.aisc_backend_evaluation:
  columns:
    created_at:
      meaning: when it was launched
      type: timestamp with time zone
    id:
      meaning: row id; ordered by created_at it is the run number people see
      type: bigint
    pid:
      meaning: public id
      type: uuid
    project_id:
      meaning: -> the engine project
      type: bigint
    status:
      meaning: Pending, Done or Failed
      type: character varying
    system_id:
      meaning: '-> project.system.pid: the AI card version it was run on'
      type: uuid
    task:
      meaning: the worker's task id
      type: uuid
  meaning: 'An evaluation: one launch, holding one or more test runs.'
engine.aisc_backend_evaluationinput:
  columns:
    component_id:
      meaning: -> engine.aisc_backend_aicomponent.id
      type: bigint
    created_at:
      meaning: when it was given
      type: timestamp with time zone
    description:
      meaning: free text
      type: character varying
    evaluation_plugin_id:
      meaning: -> engine.aisc_backend_evaluationplugin.id
      type: bigint
    helper_ref:
      meaning: a test tool used instead of a component
      type: character varying
    id:
      meaning: row id
      type: bigint
    name:
      meaning: the input's name (target, dataset...)
      type: character varying
    pid:
      meaning: public id
      type: uuid
    value:
      meaning: JSON value of the input
      type: jsonb
  meaning: An input given to a test run; the input named target is what was assessed.
engine.aisc_backend_evaluationplugin:
  columns:
    created_at:
      meaning: when it was made
      type: timestamp with time zone
    description:
      meaning: free text
      type: character varying
    error_message:
      meaning: why it failed, when it did
      type: text
    evaluation_id:
      meaning: -> engine.aisc_backend_evaluation.id
      type: bigint
    finished_at:
      meaning: when it ended
      type: timestamp with time zone
    id:
      meaning: row id
      type: bigint
    name:
      meaning: the run's name as people gave it (e.g. Age · OpenAI)
      type: character varying
    pid:
      meaning: public id
      type: uuid
    plugin_config_id:
      meaning: -> the configuration it ran with
      type: bigint
    started_at:
      meaning: when it started
      type: timestamp with time zone
    status:
      meaning: Pending, Running, Done or Failed
      type: character varying
  meaning: 'A test run: one test (plugin) inside an evaluation.'
engine.aisc_backend_measurement:
  columns:
    created_at:
      meaning: when it was stored
      type: timestamp with time zone
    description:
      meaning: free text the test wrote
      type: character varying
    dimensions:
      meaning: JSON labels of the result; its keys depend on the metric (see the project's metrics)
      type: jsonb
    direction:
      meaning: whether higher scores are better
      type: character varying
    error:
      meaning: why the result has no value, when it failed
      type: character varying
    id:
      meaning: row id
      type: bigint
    metric_id:
      meaning: '-> engine.aisc_backend_metric.id: what is measured'
      type: bigint
    name:
      meaning: the result's own name (often the metric's)
      type: character varying
    observation_id:
      meaning: '-> engine.aisc_backend_observation.id: the run''s batch of results'
      type: bigint
    pid:
      meaning: public id
      type: uuid
    score:
      meaning: the result's value
      type: double precision
    time:
      meaning: when the result was made
      type: timestamp with time zone
    uncertainty:
      meaning: uncertainty of the score, when given
      type: double precision
    unit:
      meaning: unit of the score, when any
      type: character varying
  meaning: One result of one test run. What it measures is its metric; its labels are in dimensions.
engine.aisc_backend_metric:
  columns:
    created_at:
      meaning: when it was first seen
      type: timestamp with time zone
    description:
      meaning: free text
      type: character varying
    id:
      meaning: row id
      type: bigint
    name:
      meaning: the metric's name, e.g. Conversation, Jailbreak success
      type: character varying
    pid:
      meaning: public id
      type: uuid
    type_spec:
      meaning: the metric's type, as the test declared it
      type: character varying
  meaning: What a result measures, by name (one row per metric name).
