[project]
name = "aisc-chart-assistant"
version = "0.1.0"
description = "The chart assistant: builds Superset charts from a description of the data model, on mock data, until a person validates them for the real data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "sqlglot==25.24.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chart_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs the live stack's postgres (docker exec), read only"]
