[project]
name = "aisc-report-composer"
version = "0.1.0"
description = "Assemble a report from blocks, save the layout, preview it and generate the PDF (step 7)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "jsonschema>=4.21",
    # aisc_identity is mounted from shared/; its one dependency is installed here
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["report_composer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# aisc_identity is shared by every Python service, mounted from shared/ (as control-objectives)
pythonpath = [".", "../../shared/identity"]
markers = [
    "db: needs the throwaway report bed (docker, postgres:14-alpine, never the host's 5432)",
    "e2e: runs the real renderer from ../../../aisc-report-generator in a subprocess",
]
