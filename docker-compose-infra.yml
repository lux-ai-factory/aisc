
services:

  # MinIO, the S3-compatible object storage
  minio:
    # built from source (infra/minio/Dockerfile): MinIO no longer publishes community images
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    build: ./infra/minio
    pull_policy: never
    container_name: minio
    ports:
      - "9100:9000"  # S3 API port
      - "9101:9001"  # Web console port
    volumes:
      - ../aisc-data/minio:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_USER}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Creates the buckets once MinIO is up, then exits
  make_buckets:
    # built from source (infra/minio/Dockerfile): MinIO no longer publishes community images
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    # no build: the same image as its main service, built once there (parallel builds of one tag race)
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_USER}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD}
    volumes:
      - ./tasks/minio_add_bucket.sh:/minio_add_bucket.sh
    entrypoint: /minio_add_bucket.sh

  # RabbitMQ, the queue that carries evaluation jobs to the worker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - ${MQ_PORT}:${MQ_PORT}   # RabbitMQ messaging port
      - "15672:15672" # RabbitMQ management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}

  # Redis, where the worker's Celery results are kept
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:15-alpine   # the backend requires PG15; a PG14 data dir needs fresh volumes
    container_name: postgres
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ../aisc-data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
