services:
  # The engine's web frontend
  aisc-webapp:
    image: ghcr.io/lux-ai-factory/aisc-webapp:wip-plugins
    ports:
      - "5173:80" # Development server port
    container_name: ${CONTAINER_PREFIX:-}aisc-webapp
    environment:
      APP_API_URL: ${API_URL_EXTERNAL}
      APP_SHOW_PLUGIN_VISUALIZATION: ${SHOW_PLUGIN_VISUALIZATION}
      # Keycloak URL injected into the built webapp JS at container start (env.sh replaces APP_KEYCLOAK_URL).
      APP_KEYCLOAK_URL: ${KEYCLOAK_URL_EXTERNAL}
    depends_on:
      - aisc-backend
    networks:
      - frontend

  aisc-backend:
    image: ghcr.io/lux-ai-factory/aisc-backend:wip-plugins
    container_name: ${CONTAINER_PREFIX:-}aisc-backend
    environment:
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET}
      S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET}
      S3_URL: ${S3_URL}
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ENABLE_SSL_PROXY: true
      PLUGIN_PATH: ${PLUGIN_PATH}
      # Keycloak token validation (turn auth ON in staging/prod).
      AUTH_ENABLED: ${AUTH_ENABLED}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MODEL_LISTING_SSL_VERIFY: ${MODEL_LISTING_SSL_VERIFY}
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  aisc-eval-worker:
    image: ghcr.io/lux-ai-factory/aisc-eval:wip-plugins
    container_name: ${CONTAINER_PREFIX:-}aisc-eval-worker
    environment: &eval-worker-env
      API_URL: ${API_URL} # the engine backend's API
      API_PREFIX: ${API_PREFIX}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      PLUGIN_PATH: ${PLUGIN_PATH}
      CORS_ORIGINS: "*"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # the uids this worker runs plugins as (aisc_eval/plugin_process.py): the declarations worker has its own,
      # never overlapping, since the kernel counts a uid's processes across containers
      PLUGIN_RUN_UIDS: "10100-10199"
    volumes: &eval-worker-volumes
      - ${PLUGIN_PATH}:/app/plugins:ro
    depends_on:
      - aisc-backend
      - rabbitmq
      - redis
    command: "celery -A aisc_eval.celery_worker worker --loglevel=info"
    healthcheck: &eval-worker-healthcheck
      test:
        - "CMD-SHELL"
        - celery --app aisc_eval.celery_app inspect ping -d "celery@$$HOSTNAME"
      interval: 30s
      timeout: 10s
      retries: 5
    networks: &eval-worker-networks
      - backend

  # The eval worker's second process: it reads plugin manifests and runs the plugins' form hooks
  # (aisc_eval.celery_app.PLUGIN_DECLARATIONS_QUEUE), one at a time, so a configure page never waits behind
  # the runs. It runs plugin code, so it sets the plugin firewall (NET_ADMIN), reaps what a plugin leaves
  # (init) and keeps plugins to the egress hosts below; it holds no database credential.
  aisc-eval-declarations-worker:
    image: ghcr.io/lux-ai-factory/aisc-eval:wip-plugins
    container_name: ${CONTAINER_PREFIX:-}aisc-eval-declarations-worker
    environment:
      <<: *eval-worker-env
      # what a plugin may reach through the worker's egress proxy (aisc_eval/egress.py); unset,
      # raw.githubusercontent.com; set empty, none
      PLUGIN_EGRESS_ALLOWED_HOSTS: ${PLUGIN_EGRESS_ALLOWED_HOSTS-raw.githubusercontent.com}
      # a run-uid pool of its own, apart from the run worker's: one task at a time needs one uid
      PLUGIN_RUN_UIDS: "10200-10209"
    volumes: *eval-worker-volumes
    depends_on:
      - aisc-eval-worker
      - aisc-backend
      - rabbitmq
      - redis
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
    init: true
    command: "celery -A aisc_eval.celery_worker worker --loglevel=info --queues=plugin-declarations --concurrency=1"
    healthcheck: *eval-worker-healthcheck
    networks: *eval-worker-networks

  aisc-eval-flower:
    image: ghcr.io/lux-ai-factory/aisc-eval:wip-plugins
    container_name: ${CONTAINER_PREFIX:-}aisc-eval-flower
    environment:
      API_URL: ${API_URL} # the engine backend's API
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      FLOWER_URL_PREFIX: flower
    volumes:
      - /home/deployer/plugins:/app/plugins:ro
    depends_on:
      - aisc-backend
      - rabbitmq
      - redis
    command: "celery -A aisc_eval.celery_worker flower"
    healthcheck:
      test:
        - "CMD-SHELL"
        - celery --app aisc_eval.celery_app inspect ping -d "celery@$$HOSTNAME"
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend
