services:
  # # Frontend development staging
  aisc-webapp:
    image: ghcr.io/lux-ai-factory/aisc-webapp:v1.3.0
    container_name: aisc-webapp
    environment:
      APP_API_URL: ${API_URL_EXTERNAL}
      APP_SHOW_PLUGIN_VISUALIZATION: ${SHOW_PLUGIN_VISUALIZATION}
      APP_SHOW_CELERY_TASKS: ${SHOW_CELERY_TASKS}
      # Keycloak URL injected into the built webapp JS at container start (env.sh replaces APP_KEYCLOAK_URL).
      APP_KEYCLOAK_URL: ${KEYCLOAK_URL_EXTERNAL}
      # Public catalogue URL injected into the built webapp JS at container start (env.sh replaces APP_CATALOG_URL).
      APP_CATALOG_URL: ${CATALOG_URL}
    depends_on:
      - aisc-backend
    networks:
      - frontend

  aisc-backend:
    image: ghcr.io/lux-ai-factory/aisc-backend:v1.3.0
    container_name: aisc-backend
    environment:
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET}
      S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET}
      S3_URL: ${S3_URL}
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_ENGINE: ${DB_ENGINE}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS}
      BACKEND_CSRF_TRUSTED_ORIGINS: ${BACKEND_CSRF_TRUSTED_ORIGINS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ENABLE_SSL_PROXY: true
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      PLUGIN_PATH: ${PLUGIN_PATH}
      PACKAGE_REGISTRY_URL: ${PACKAGE_REGISTRY_URL}
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX}
      # immudb audit ledger — inside docker the host is the SERVICE NAME, not localhost.
      IMMUDB_URL: immudb:3322
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Keycloak token validation (turn auth ON in staging/prod).
      AUTH_ENABLED: ${AUTH_ENABLED}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      MODEL_LISTING_SSL_VERIFY: ${MODEL_LISTING_SSL_VERIFY}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:ro

  aisc-eval-worker:
    image: ghcr.io/lux-ai-factory/aisc-eval:v1.3.0
    container_name: aisc-eval-worker
    environment:
      API_URL: ${API_URL} # Address of api-backend
      API_PREFIX: ${API_PREFIX}
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      PLUGIN_PATH: ${PLUGIN_PATH}
      PACKAGE_REGISTRY_URL: ${PACKAGE_REGISTRY_URL}
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    volumes:
      - ${PLUGIN_PATH}:/app/plugins:ro
    depends_on:
      - aisc-backend
      - rabbitmq
      - redis
    healthcheck:
      test:
        - "CMD-SHELL"
        - celery --app aisc_eval.celery_app inspect ping -d "celery@$$HOSTNAME"
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  aisc-eval-flower:
    image: ghcr.io/lux-ai-factory/aisc-eval:v1.3.0
    container_name: aisc-eval-flower
    environment:
      REDIS_BACKEND_URL: ${REDIS_BACKEND_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CORS_ORIGINS: "*"
      FLOWER_URL_PREFIX: flower
      FLOWER_UNAUTHENTICATED_API: "true"
    depends_on:
      - aisc-eval-worker
      - aisc-backend
      - rabbitmq
      - redis
    volumes:
      - ${PLUGIN_PATH}:/app/plugins
      - flower_data:/data
    command: "celery -A aisc_eval.celery_worker flower --db=/data/flower.db --persistent=True"
    healthcheck:
      test:
        - "CMD-SHELL"
        - celery --app aisc_eval.celery_app inspect ping -d "celery@$$HOSTNAME"
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

 # ── AI-compliance checklists app (apps/controls submodule) ──
  controls-pdf:
    image: ghcr.io/lux-ai-factory/controls:staging
    container_name: controls-pdf
    restart: unless-stopped
    networks:
      - backend

  controls-migrate:
    image: ghcr.io/lux-ai-factory/controls:staging
    container_name: controls-migrate
    command: >
      sh -c "until npx prisma migrate deploy; do echo '[controls] waiting for postgres'; sleep 2; done && npx prisma db seed"
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/controls?schema=public"
      PDF_RENDERER_URL: http://controls-pdf:8005
      AISC_ENABLE_TEMPLATE_EDITOR: false
      AISC_PLATFORM: true
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  controls-web:
    image: ghcr.io/lux-ai-factory/controls-web:staging
    container_name: controls-web
    environment:
      AISC_BACKEND_URL: http://aisc-backend:8000
    depends_on:
      controls-migrate:
        condition: service_completed_successfully
      controls-pdf:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
      - frontend

  qualification-llm:
    image: ghcr.io/lux-ai-factory/qualification-llm:staging
    container_name: qualification-llm
    environment:
      QUALIFICATION_LLM_MODEL: deepseek-v4-flash-vllm
      QUALIFICATION_LLM_API_BASE: https://rsfllm.uni.lux/litellm/
      QUALIFICATION_LLM_API_KEY: ${QUALIFICATION_LLM_API_KEY}
    restart: unless-stopped
    networks:
      - backend

  # System-card PDF renderer sidecar.
  qualification-pdf:
    image: ghcr.io/lux-ai-factory/qualification-renderer:staging
    container_name: qualification-pdf
    restart: unless-stopped
    networks:
      - backend

  qualification-migrate:
    image: ghcr.io/lux-ai-factory/qualification:staging
    container_name: qualification-migrate
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/qualification?schema=public"
    command: >
      sh -c "until npx prisma migrate deploy; do echo '[qualification] waiting for postgres'; sleep 2; done"
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  qualification-web:
    image: ghcr.io/lux-ai-factory/qualification-web:staging
    container_name: qualification-web
    command: ["npx", "next", "start", "-p", "3000"]
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/qualification?schema=public"
      AISC_BACKEND_URL: http://aisc-backend:8000
      LLM_SERVICE_URL: "http://qualification-llm:4000"
      SYSTEM_CARD_RENDERER_URL: "http://qualification-pdf:8005"
      ONTOLOGY_SERVICE_URL: "http://qualification-ontology:8011"
    depends_on:
      qualification-migrate:
        condition: service_completed_successfully
      qualification-llm:
        condition: service_started
      qualification-pdf:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
      - frontend



volumes:
  flower_data:
