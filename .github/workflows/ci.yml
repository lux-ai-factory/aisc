# Every module's tests, run from the aisc checkout with its public submodules. The database suites start
# throwaway Postgres containers with scripts/lib/throwaway-pg.sh, as they do on a workstation.
name: ci

on:
  push:
    branches: [feat/unified-modules, main, master]
  pull_request:

permissions:
  contents: read

env:
  PUBLIC_SUBMODULES: >-
    apps/backend apps/eval apps/webapp apps/controls apps/qualification apps/control-objectives
    apps/results-dashboard shared/plugin-interface shared/plugin-manager apps/catalogue apps/report-generator
    shared/report-plugin-interface
  # no job reads Git LFS content: the submodules' LFS files (eval's test data) stay pointers
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  python:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: identity
            run: scripts/lib/identity-tests.sh
          - suite: platform
            run: scripts/test-platform.sh -q -p no:warnings
          - suite: control-objectives
            run: scripts/lib/co-tests.sh -p no:warnings
          - suite: report-composer
            run: cd apps/report-composer && uv run --extra dev pytest -q -p no:warnings
          # the engine without upstream's integration package (it needs a live stack), then its project database
          # tests on a throwaway Postgres in configurator mode
          - suite: engine
            run: scripts/lib/engine-tests.sh
          - suite: engine on postgres
            run: scripts/lib/engine-tests.sh --postgres
          # a few eval tests run only in one deployment mode: both modes
          - suite: eval
            run: cd apps/eval && uv run --locked --no-dev --group test pytest -q -p no:cacheprovider && AISC_DEPLOYMENT=configurator uv run --locked --no-dev --group test pytest -q -p no:cacheprovider
          - suite: eval lint
            run: cd apps/eval && uv run --locked --only-group dev ruff check . && uv run --locked --only-group dev ruff format --check .
          - suite: plugin-manager
            run: cd shared/plugin-manager && uv run --locked --with pytest python -m pytest -q -p no:cacheprovider
          - suite: plugin-interface
            run: cd shared/plugin-interface && uv run --locked --with pytest --with pandas python -m pytest -q -p no:cacheprovider
          # its db tests start throwaway Postgres containers; the caller's database addresses must not reach them
          - suite: report-generator
            run: cd apps/report-generator && env -u DATABASE_URL -u PLATFORM_TEST_DATABASE_URL uv run --locked --extra dev pytest -q -p no:cacheprovider tests
    steps:
      - uses: actions/checkout@v4
      - run: |
          # shellcheck disable=SC2086
          git submodule update --init --depth 50 $PUBLIC_SUBMODULES
      - uses: astral-sh/setup-uv@v5
      # the fonts the golden PDFs were rendered with (Arial is Liberation Sans there); a runner without them falls back
      # to another sans-serif and the PDF text differs
      - name: the report fonts
        if: matrix.suite == 'report-generator'
        run: |
          missing=()
          for package in fonts-liberation fonts-dejavu-core; do
            dpkg -s "$package" >/dev/null 2>&1 || missing+=("$package")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -q && sudo apt-get install -y -q "${missing[@]}"
          fi
      - run: ${{ matrix.run }}

  repository-checks:
    name: repository checks
    runs-on: ubuntu-latest
    steps:
      # the guard compares against older commits of the root and of the engine: full history
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          # shellcheck disable=SC2086
          git submodule update --init $PUBLIC_SUBMODULES
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      # the test beds run each module's own migrations, with the environment a workstation has
      - run: scripts/prepare-tests.sh
      # the port tests occupy ports this machine leaves free: one that cannot run here fails instead of skipping
      - env:
          AISC_PORT_TESTS_MUST_RUN: "1"
        run: >-
          cd scripts/tests && uv run --no-project --with pytest --with pyyaml --with 'psycopg[binary]'
          python -m pytest -q -p no:cacheprovider -p no:warnings

  # Windows: the public submodules check out (no file name Windows refuses, Linux line endings kept), and the
  # install script's own tests pass there. Docker cannot run Linux containers on this runner, so the stack itself
  # is not started; that is proven on Linux.
  windows:
    name: windows install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          # shellcheck disable=SC2086
          git submodule update --init --depth 50 $PUBLIC_SUBMODULES
      - uses: astral-sh/setup-uv@v5
      # as on Linux, a port test that cannot run fails; but the one that holds port 80 with a Linux container
      - env:
          AISC_PORT_TESTS_MUST_RUN: "1"
        run: >-
          uv run --no-project --with pytest python -m pytest -q -p no:cacheprovider
          scripts/tests/test_aisc_py.py scripts/tests/test_busy_ports.py scripts/tests/test_windows_names.py
          scripts/tests/test_line_endings.py
          --deselect scripts/tests/test_busy_ports.py::test_a_busy_engine_port_is_moved

  node:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: qualification
            database: cd apps/qualification && test/db/throwaway-db.sh
          - app: controls
            database: scripts/lib/controls-tests.sh
    steps:
      - uses: actions/checkout@v4
      - run: |
          # shellcheck disable=SC2086
          git submodule update --init --depth 50 $PUBLIC_SUBMODULES
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npx tsc --noEmit -p .
        working-directory: apps/${{ matrix.app }}
      - run: npx vitest run test/unit test/vendor
        working-directory: apps/${{ matrix.app }}
      - run: ${{ matrix.database }}

  sidecars:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/qualification/services/agents
          - apps/qualification/services/ontology
          - apps/qualification/services/prefill
          - apps/qualification/services/system_card_renderer
          - apps/controls/services/pdf_renderer
    steps:
      - uses: actions/checkout@v4
      - run: |
          # shellcheck disable=SC2086
          git submodule update --init --depth 50 $PUBLIC_SUBMODULES
      - uses: astral-sh/setup-uv@v5
      - working-directory: ${{ matrix.service }}
        run: |
          dev=""
          [ -f requirements-dev.txt ] && dev="--with-requirements requirements-dev.txt"
          # shellcheck disable=SC2086
          uv run --no-project --python 3.12 --with-requirements requirements.txt $dev \
            --with pytest --with httpx python -m pytest -q -p no:cacheprovider -p no:warnings
