# Every module's tests, run from the aisc checkout with its public submodules. The database suites start
# throwaway Postgres containers with scripts/lib/throwaway-pg.sh, as they do on a workstation. The python matrix
# holds the rows of scripts/suites.py marked ci, with their names and commands (scripts/tests/test_suites.py).
name: ci

on:
  push:
    branches: [pilot, main, master]
  pull_request:

permissions:
  contents: read

env:
  PUBLIC_SUBMODULES: >-
    apps/backend apps/eval apps/webapp apps/controls apps/qualification apps/control-objectives
    apps/results-dashboard shared/plugin-interface shared/plugin-manager apps/catalogue apps/report-generator
    shared/report-plugin-interface
  # no job reads Git LFS content: the submodules' LFS files (eval's test data) stay pointers
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  python:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: identity
            run: scripts/lib/identity-tests.sh
          # the runner starts a throwaway Postgres, MinIO and immudb, and fails on a skip it does not allow
          - suite: platform
            run: scripts/test-platform.sh -q -p no:warnings
          - suite: control-objectives
            run: scripts/lib/co-tests.sh -p no:warnings
          - suite: report-composer
            run: cd apps/report-composer && uv run --extra dev pytest -q -p no:warnings
          # the engine without upstream's integration package (it needs a live stack), then its project database
          # tests on a throwaway Postgres in configurator mode
          - suite: engine
            run: scripts/lib/engine-tests.sh
          - suite: engine on postgres
            run: scripts/lib/engine-tests.sh --postgres
          # a few eval tests run only in one deployment mode: both modes
          - suite: eval
            run: cd apps/eval && uv run --locked --no-dev --group test pytest -q -p no:cacheprovider && AISC_DEPLOYMENT=configurator uv run --locked --no-dev --group test pytest -q -p no:cacheprovider
          - suite: eval lint
            run: cd apps/eval && uv run --locked --only-group dev ruff check . && uv run --locked --only-group dev ruff format --check .
          - suite: plugin-manager
            run: cd shared/plugin-manager && uv run --locked --with pytest python -m pytest -q -p no:cacheprovider
          # onnx and onnxruntime, as the submodule's own CI runs it: its model-format tests import them
          - suite: plugin-interface
            run: cd shared/plugin-interface && uv run --locked --with pytest --with pandas --with onnx --with onnxruntime python -m pytest -q -p no:cacheprovider
          # its db tests start throwaway Postgres containers; the caller's database addresses must not reach them
          - suite: report-generator
            run: cd apps/report-generator && env -u DATABASE_URL -u PLATFORM_TEST_DATABASE_URL uv run --locked --extra dev pytest -q -p no:cacheprovider tests
          # the tests marked db read the live stack's Postgres: not in CI
          - suite: chart-assistant
            run: cd apps/chart-assistant && uv run --locked --extra dev pytest -q -p no:cacheprovider -m 'not db'
          # the sign-in tests import Superset: they run inside the dashboard's own image
          # the tests that build the baked stack's images; the repository checks run the rest of scripts/tests
          - suite: baked images
            run: cd scripts/tests && uv run --no-project --with pytest --with pyyaml python -m pytest -q -p no:cacheprovider -p no:warnings -m images test_baked_images.py
          - suite: results dashboard sso
            run: cd apps/results-dashboard && docker build -q -t aisc-t-dashboard . >/dev/null && docker run --rm -u root -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/w -e AISC_IDENTITY_DIR=/identity -v "$PWD:/w:ro" -v "$PWD/../../shared/identity:/identity:ro" -w /w --entrypoint sh aisc-t-dashboard -c 'pip install -q pytest && python -m pytest -q -p no:cacheprovider tests/test_sso_login.py'
    steps:
      - uses: actions/checkout@v4
      - run: |
          # shellcheck disable=SC2086
          git submodule update --init --depth 50 $PUBLIC_SUBMODULES
      - uses: astral-sh/setup-uv@v5
      # the fonts the golden PDFs were rendered with (Arial is Liberation Sans there); a runner without them falls back
      # to another sans-serif and the PDF text differs
      - name: the report fonts
        if: matrix.suite == 'report-generator'
        run: |
          missing=()
          for package in fonts-liberation fonts-dejavu-core; do
            dpkg -s "$package" >/dev/null 2>&1 || missing+=("$package")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -q && sudo apt-get install -y -q "${missing[@]}"
          fi
      # the ledger tests run the engine's own immudb integration test in the engine's environment
      - name: the engine environment
        if: matrix.suite == 'platform'
        run: cd apps/backend && uv sync --locked
      # the proof-file store tests run on the stack's own MinIO image, built from source
      - name: the MinIO image
        if: matrix.suite == 'platform'
        run: docker build -q -t aisc-minio:latest infra/minio
      - run: ${{ matrix.run }}

  repository-checks:
    name: repository checks
    runs-on: ubuntu-latest
    steps:
      # the guard compares against older commits of the root and of the engine: full history
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          # shellcheck disable=SC2086
          git submodule update --init $PUBLIC_SUBMODULES
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      # the backup test restores into working services and fails, not skips, when this image is not built
      - run: docker build -t aisc-minio:latest infra/minio
      # the test beds run each module's own migrations, with the environment a workstation has
      - run: scripts/prepare-tests.sh
      # the port tests occupy ports this machine leaves free: one that cannot run here fails instead of skipping; the
      # tests that build the baked images run in their own job
      - env:
          AISC_PORT_TESTS_MUST_RUN: "1"
        run: >-
          cd scripts/tests && uv run --no-project --with pytest --with pyyaml --with 'psycopg[binary]'
          python -m pytest -q -p no:cacheprovider -p no:warnings -m 'not images'

  # Every lock of the checkout, submodules included, against published advisories: a high or critical one fails
  # (scripts/audit-dependencies.sh; accepted advisories with a date in scripts/audit-accepted.txt)
  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      - run: bash scripts/audit-dependencies.sh

  # Windows: the public submodules check out (no file name Windows refuses, Linux line endings kept), and the
  # install script's own tests pass there. Docker cannot run Linux containers on this runner, so the stack itself
  # is not started; that is proven on Linux.
  windows:
    name: windows install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          # shellcheck disable=SC2086
          git submodule update --init --depth 50 $PUBLIC_SUBMODULES
      - uses: astral-sh/setup-uv@v5
      # as on Linux, a port test that cannot run fails; but the one that holds port 80 with a Linux container
      - env:
          AISC_PORT_TESTS_MUST_RUN: "1"
        run: >-
          uv run --no-project --with pytest --with pyyaml python -m pytest -q -p no:cacheprovider
          scripts/tests/test_aisc_py.py scripts/tests/test_busy_ports.py scripts/tests/test_windows_names.py
          scripts/tests/test_line_endings.py
          --deselect scripts/tests/test_busy_ports.py::test_a_busy_engine_port_is_moved

  node:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: qualification
            typecheck: npx tsc --noEmit -p .
            tests: npx vitest run test/unit test/vendor
            database: cd apps/qualification && test/db/throwaway-db.sh
          - app: controls
            typecheck: npx tsc --noEmit -p .
            tests: npx vitest run test/unit test/vendor
            database: scripts/lib/controls-tests.sh
          # the engine webapp (upstream's React app): its tsconfig.json only references the two below
          - app: webapp
            typecheck: npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.node.json
            tests: npx vitest run
    steps:
      - uses: actions/checkout@v4
      - run: |
          # shellcheck disable=SC2086
          git submodule update --init --depth 50 $PUBLIC_SUBMODULES
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: ${{ matrix.typecheck }}
        working-directory: apps/${{ matrix.app }}
      - run: ${{ matrix.tests }}
        working-directory: apps/${{ matrix.app }}
      - run: ${{ matrix.database }}
        if: matrix.database

  sidecars:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/qualification/services/agents
          - apps/qualification/services/ontology
          - apps/qualification/services/prefill
          - apps/qualification/services/system_card_renderer
          - apps/controls/services/pdf_renderer
    steps:
      - uses: actions/checkout@v4
      - run: |
          # shellcheck disable=SC2086
          git submodule update --init --depth 50 $PUBLIC_SUBMODULES
      - uses: astral-sh/setup-uv@v5
      - working-directory: ${{ matrix.service }}
        run: |
          if [ -f overrides.txt ]; then
            # as its image installs: overrides.txt raises pins of requirements.txt's packages, which uv run cannot
            uv venv -q --python 3.12 "$RUNNER_TEMP/service"
            VIRTUAL_ENV="$RUNNER_TEMP/service" uv pip install -q -r requirements.txt --override overrides.txt pytest httpx
            "$RUNNER_TEMP/service/bin/python" -m pytest -q -p no:cacheprovider -p no:warnings
            exit
          fi
          dev=""
          [ -f requirements-dev.txt ] && dev="--with-requirements requirements-dev.txt"
          # shellcheck disable=SC2086
          uv run --no-project --python 3.12 --with-requirements requirements.txt $dev \
            --with pytest --with httpx python -m pytest -q -p no:cacheprovider -p no:warnings
