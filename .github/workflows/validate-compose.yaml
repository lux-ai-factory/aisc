name: Validate compose files

on:
  pull_request:
  push:
    branches:
      - "master"
      - "main"
      - "dev"
  workflow_dispatch:

jobs:
  validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The user-facing entry point must always be valid: it is what the README
      # tells the community to run.
      - name: Validate published-image stack (docker-compose.yml)
        run: docker compose --env-file env.example -f docker-compose.yml config > /dev/null

      - name: Validate development stack
        run: >
          docker compose --env-file env.development
          -f docker-compose-infra.development.yml
          -f docker-compose.development.yml config > /dev/null

      - name: Validate development stack with plugin downloader
        run: >
          docker compose --env-file env.plugin_downloader
          -f docker-compose.plugin_downloader.yml
          -f docker-compose-infra.development.yml
          -f docker-compose.development.yml config > /dev/null

      - name: Validate staging stack
        run: >
          docker compose --env-file env.staging
          -f docker-compose-infra.staging.yml
          -f docker-compose.staging.yml config > /dev/null
