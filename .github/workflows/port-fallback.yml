# A whole copy of AISC started with its default browser ports taken, then signed into on the ports it moved to
# (scripts/verify-port-fallback.sh). It builds every image of the stack, so it runs by hand and once a week, not
# on a push. A schedule fires only from the repository's default branch: to check another branch, run it by
# hand (Actions > port fallback > Run workflow) and pick the branch there.
name: port fallback

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  port-fallback:
    name: port fallback
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # the check clones this checkout and its submodules locally: full history, no shallow clones to copy
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      # every image of the stack is built: the runner's preinstalled toolchains make room for them
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: astral-sh/setup-uv@v5
      - run: scripts/verify-port-fallback.sh
