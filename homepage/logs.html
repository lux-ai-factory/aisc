<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Activity log - AI Assessment Sandbox Configurator</title>
<link rel="icon" href="/assets/laif-logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  /* The launcher's look (homepage/project.html): same tokens, header and session line.
     Everything this page decides is decided by the platform; the page only shows it. */
  :root{
    --bg:#fbfbfd; --panel:#ffffff;
    --text:#000000; --muted:#474c60; --faint:#6b7288;
    --primary:#000fdf; --primary-hover:#000079;
    --accent:#ff007e;
    --border:#d3d8e6; --border-strong:#a9b0c6;
    --radius:0px;
    --gutter:40px;
    --col-centre:calc((100% - 2 * var(--gutter)) / 6);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --error:#b3123c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    position:relative; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(to right, rgba(0,15,223,.065) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,15,223,.065) 1px, transparent 1px);
    background-size:40px 40px;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 42%, #000 35%, transparent 100%);
            mask-image:radial-gradient(ellipse 90% 70% at 50% 42%, #000 35%, transparent 100%);
  }
  .shell{position:relative; z-index:1}

  /* ---- header ---- */
  .topbar{
    display:flex; align-items:center; gap:22px;
    padding:16px 32px; border-bottom:1px solid var(--border);
    background:rgba(255,255,255,.82); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:10;
  }
  .topbar img{height:32px; width:auto; display:block}
  .topbar .back{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--primary); text-decoration:none; border:1px solid var(--border-strong);
    padding:7px 11px; white-space:nowrap;
  }
  .topbar .back:hover{background:var(--primary); color:#fff; border-color:var(--primary)}
  .topbar .rule{width:1px; height:28px; background:var(--border-strong)}
  .topbar h1{
    margin:0; font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.14em; color:var(--text);
  }
  .session{
    margin-left:auto;
    display:flex; align-items:center; gap:14px;
    font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap;
  }
  .session b{color:var(--text); font-weight:500}
  .session a{color:var(--primary); text-decoration:none; border-bottom:1px solid transparent}
  .session a:hover{border-bottom-color:var(--primary)}

  main{max-width:1180px; margin:0 auto; padding:40px 32px 64px}
  .title{margin:0 0 4px; font-size:26px; font-weight:600; letter-spacing:-.02em}
  .subtitle{margin:0 0 30px; font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  .note{
    margin:0 0 22px; padding:12px 14px; border-left:3px solid var(--border-strong);
    color:var(--muted); font-size:13px; background:rgba(0,15,223,.02);
  }
  section{margin-top:34px}
  section h2{
    margin:0 0 6px; font-size:13px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
  }
  section > p{margin:0 0 16px; color:var(--muted); font-size:13.5px; max-width:80ch}

  /* ---- the activity log ---- */
  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border)}
  th, td{padding:10px 12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; font-size:13px}
  th{font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.1em; text-transform:uppercase;
     color:var(--faint); background:#f7f8fc}
  td.mono{font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap}
  td.refused{color:var(--error)}
  /* button and a.button set display, which would beat the hidden attribute */
  [hidden]{display:none !important}
  form.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 16px}
  input, select{font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--border-strong); background:#fff; border-radius:0}
  label.check{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
  button, a.button{display:inline-flex; align-items:center; padding:8px 14px; cursor:pointer; text-decoration:none;
     border:1px solid var(--primary); background:var(--primary); color:#fff;
     font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase}
  button.ghost, a.button.ghost{background:transparent; color:var(--primary)}
  .msg{display:block; margin-top:10px; font-size:12.5px; color:var(--muted)}
  .msg.err{color:var(--error)}
  @media (max-width:820px){ .topbar{padding:12px 18px; gap:14px} main{padding:28px 18px 40px} td.mono{white-space:normal} }
</style>
</head>
<body>
<div class="shell">
<div class="topbar">
  <a class="back" id="back" href="/">&larr; Project</a>
  <img src="/assets/laif-logo.svg" alt="Luxembourg AI Factory"/>
  <span class="rule"></span>
  <h1>AI Assessment Sandbox Configurator</h1>
  <span class="session"><a href="/oauth2/sign_out?rd=%2F">sign out</a></span>
</div>
<main>
  <h1 class="title">Activity log</h1>
  <p class="subtitle" id="meta">&hellip;</p>
  <p class="note">Who did what in this project, from the tamper-evident ledger. Every row shown here was
    checked against the ledger by the platform before it reached this page.</p>
  <form class="filters" id="filters">
    <select name="step"><option value="">every step</option><option value="0">requests</option>
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
    <input name="action" placeholder="action, e.g. risk.rated"/>
    <input name="item_id" placeholder="item id"/>
    <label class="check"><input type="checkbox" name="ai" value="true"/> AI only</label>
    <button type="submit">Filter</button>
    <a class="button ghost" id="export" hidden>Export for an auditor</a>
  </form>
  <table>
    <thead><tr><th>#</th><th>When</th><th>Who</th><th>Action</th><th>Item</th><th>Step</th><th>App</th><th>Outcome</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="ghost" id="more" hidden type="button">Older entries</button>
  <span class="msg" id="msg"></span>
</main>
</div>
<script src="/assets/ledger-beacon.js"></script>
<script>
  // Thin on purpose: the platform filters, verifies and names people; this page only lays rows out.
  var slug = new URLSearchParams(window.location.search).get('project') || '';
  var base = '/api/projects/' + encodeURIComponent(slug) + '/ledger/events';
  var cursor = null;
  document.getElementById('back').href = '/p/' + encodeURIComponent(slug);
  document.getElementById('meta').textContent = slug;

  function cell(text, cls) {
    var td = document.createElement('td');
    if (cls) td.className = cls;
    td.textContent = text == null ? '' : String(text);
    return td;
  }
  function who(e) {
    var a = e.actor || {};
    if (a.kind === 'ai' || a.kind === 'worker') {
      var p = e.on_behalf_of || {};
      return (e.program || a.kind) + (e.model ? ' (' + e.model + ')' : '') + ' for ' + (p.name || p.sub || 'someone');
    }
    if (a.alarm) return 'mapping alarm';
    if (a.erased) return 'erased';
    return a.name || a.sub || a.kind || '';
  }
  var submitted = null;   // the filters of the list on screen: "Older entries" pages that list, not the form
  function load(reset) {
    if (reset || !submitted) {
      submitted = new URLSearchParams(new FormData(document.getElementById('filters')));
      [].slice.call(submitted.keys()).forEach(function (k) { if (!submitted.get(k)) submitted.delete(k); });
      cursor = null;
      document.getElementById('rows').textContent = '';   // a new list never shows the old one's rows
      document.getElementById('more').hidden = true;
    }
    var q = new URLSearchParams(submitted);
    if (!reset && cursor) q.set('cursor', cursor);
    var msg = document.getElementById('msg');
    msg.className = 'msg'; msg.textContent = 'loading...';
    fetch(base + '?' + q.toString(), {credentials: 'same-origin'}).then(function (r) {
      return r.json().then(function (body) { return {ok: r.ok, status: r.status, body: body}; });
    }).then(function (res) {
      if (!res.ok) {
        msg.className = 'msg err';
        msg.textContent = res.status === 409 ? 'ALARM: ' + res.body.detail : (res.body.detail || 'not available');
        return;
      }
      var rows = document.getElementById('rows');
      res.body.events.forEach(function (e) {
        var tr = document.createElement('tr');
        tr.appendChild(cell(e.seq, 'mono'));
        tr.appendChild(cell((e.occurred_at || '').replace('T', ' ').slice(0, 19), 'mono'));
        tr.appendChild(cell(who(e)));
        tr.appendChild(cell(e.action, 'mono'));
        tr.appendChild(cell([e.item_type, e.item_id].filter(Boolean).join(' '), 'mono'));
        tr.appendChild(cell(e.step, 'mono'));
        tr.appendChild(cell(e.source_app, 'mono'));
        var out = cell(e.outcome === 'refused' ? 'refused: ' + ((e.details || {}).reason || '') : e.outcome, 'mono');
        if (e.outcome === 'refused') out.className += ' refused';
        tr.appendChild(out);
        rows.appendChild(tr);
      });
      cursor = res.body.next;
      document.getElementById('more').hidden = !cursor;
      msg.textContent = rows.children.length ? '' : 'nothing yet';
    }).catch(function () { msg.className = 'msg err'; msg.textContent = 'the log could not be read'; });
  }
  document.getElementById('filters').addEventListener('submit', function (ev) { ev.preventDefault(); load(true); });
  document.getElementById('more').addEventListener('click', function () { load(false); });
  fetch('/api/authz/projects/' + encodeURIComponent(slug), {credentials: 'same-origin'})
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (a) {
      if (a && (a.admin || a.role === 'owner')) {
        var ex = document.getElementById('export');
        ex.href = '/api/projects/' + encodeURIComponent(slug) + '/ledger/export';
        ex.hidden = false;
      }
    });
  load(true);
  if (window.aiscBeacon) window.aiscBeacon(slug, 'page.opened', {page: '/logs.html'});
</script>
</body>
</html>
