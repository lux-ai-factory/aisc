<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Assessment Sandbox Configurator</title>
<link rel="icon" href="/assets/laif-logo.svg"/>
<link rel="stylesheet" href="/assets/launcher.css"/>
<style>
  /* The tokens, fonts, header and session line are /assets/launcher.css (electric blue, hot pink, no
     rounded corners, hairlines and monospace labels); this page sets its header a size larger. */
  /* one cold wash of brand blue, one warm of accent: depth without noise */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 420px at 8% -8%, rgba(0,15,223,.07), transparent 70%),
      radial-gradient(700px 360px at 104% 108%, rgba(255,0,126,.06), transparent 70%);
  }

  /* ---- header: hairline, logo, product name, session ---- */
  .topbar{gap:26.4px}
  .topbar .rule{height:33.6px}
  .session{margin-left:auto; gap:16.8px; font-size:13.8px}

  main{
    max-width:1360px; margin:0 auto; padding:40px 32px 32px;
    min-height:calc(100vh - 89px); display:flex; flex-direction:column; justify-content:center;
  }

  /* ---- endpoints: in the header, out of the way until asked for ---- */
  .menu{position:relative; margin-left:24px}
  .menu summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:8.4px;
    padding:7.2px 12px; border:1px solid var(--border);
    font-family:var(--mono); font-size:13.2px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    transition:border-color .14s ease, color .14s ease;
  }
  .menu summary::-webkit-details-marker{display:none}
  .menu summary:hover{color:var(--primary); border-color:var(--border-strong)}
  .menu summary:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
  .menu summary svg{
    width:13.2px; height:13.2px; stroke:currentColor; stroke-width:2; fill:none;
    transition:transform .16s ease;
  }
  .menu[open] summary{color:var(--primary); border-color:var(--primary)}
  .menu[open] summary svg{transform:rotate(180deg)}
  .menu .panel{
    position:absolute; right:0; top:calc(100% + 9px); z-index:30; min-width:261.6px;
    padding:6px 0; background:var(--panel);
    border:1px solid var(--border-strong); box-shadow:0 14px 34px rgba(12,18,60,.13);
  }
  .menu .panel a{
    display:block; padding:10.8px 18px; text-decoration:none;
    font-family:var(--mono); font-size:13.8px; color:var(--text);
  }
  .menu .panel a:hover{background:var(--panel-2); color:var(--primary)}
  .menu .panel a:focus-visible{outline:2px solid var(--primary); outline-offset:-2px}

  @media (max-width:820px){
    .topbar{padding:14.4px 21.6px; gap:16.8px}
    main{padding:28px 18px 32px; min-height:0; display:block}
  }

  /* ---- projects: bigger cards, centred as one wrapped row, the heading over them ---- */
  .stage{width:fit-content; max-width:100%; margin:0 auto}
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:30px}
  .head h2{
    margin:0; font-size:16px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--heading);
  }
  .newbtn{
    display:inline-flex; align-items:center; gap:8px; padding:13px 20px;
    border:1px solid var(--primary); background:var(--primary); color:#fff;
    font-family:var(--mono); font-size:14px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  }
  .newbtn:hover{background:var(--primary-hover); border-color:var(--primary-hover)}
  .newbtn.ghost{background:transparent; color:var(--primary)}
  .newbtn.ghost:hover{background:rgba(0,15,223,.06); color:var(--primary-hover)}

  .projects{display:flex; flex-wrap:wrap; justify-content:center; gap:24px}
  a.project{
    width:440px; max-width:100%;
    display:flex; flex-direction:column; gap:12px; padding:34px; min-height:210px;
    border:1px solid var(--border); background:var(--panel); text-decoration:none; color:inherit;
    transition:border-color .14s ease, box-shadow .14s ease, transform .14s ease;
  }
  a.project:hover{
    border-color:var(--primary); transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(12,18,60,.09);
  }
  a.project:focus-visible{outline:2px solid var(--primary); outline-offset:3px}
  a.project h3{margin:0; font-size:26px; font-weight:600; letter-spacing:-.015em}
  a.project .slug{
    font-family:var(--mono); font-size:14px; color:var(--primary);
    letter-spacing:.04em;
  }
  a.project p{margin:0; color:var(--muted); font-size:17px}
  a.project time{font-family:var(--mono); font-size:14px; color:var(--faint); margin-top:auto}

  .empty{
    width:560px; max-width:100%;
    padding:52px; border:1px dashed var(--border-strong); background:transparent;
    color:var(--muted); font-size:17px; text-align:center;
  }

  dialog.new{
    border:1px solid var(--border-strong); padding:0; background:var(--panel);
    box-shadow:0 30px 70px rgba(12,18,60,.22); max-width:460px; width:92vw;
  }
  dialog.new::backdrop{background:rgba(12,18,60,.35)}
  dialog.new form{display:flex; flex-direction:column; gap:14px; padding:26px}
  dialog.new h3{margin:0; font-size:17px; font-weight:600}
  dialog.new label{
    display:flex; flex-direction:column; gap:6px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted);
  }
  dialog.new input, dialog.new textarea{
    font:inherit; font-size:14px; padding:10px 12px; color:var(--text);
    border:1px solid var(--border-strong); background:var(--panel); border-radius:0;
  }
  dialog.new input:focus, dialog.new textarea:focus{outline:2px solid var(--primary); outline-offset:-1px}
  dialog.new .row{display:flex; gap:10px; justify-content:flex-end; margin-top:4px}
  dialog.new .err{color:var(--error); font-size:12.5px; min-height:1em}

  /* ---- my tasks: what the platform lists for me across my projects, above the projects ---- */
  .mine{width:100%; max-width:1360px; margin:0 auto 40px; padding:22px 26px; border:1px solid var(--border);
    background:var(--panel)}
  .mine h2{margin:0 0 6px; font-size:16px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
    color:var(--heading)}
  .mine h3{margin:16px 0 6px; font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em;
    text-transform:uppercase; color:var(--faint)}
  .mine ul{margin:0; padding:0; list-style:none}
  .mine li{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border);
    font-size:14.5px}
  .mine li .where{font-family:var(--mono); font-size:12px; color:var(--muted)}
  .mine li a{color:var(--primary); font-family:var(--mono); font-size:12px}
  .mine button{padding:5px 10px; cursor:pointer; border:1px solid var(--primary); background:var(--primary); color:#fff;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase}
  .mine button.ghost{background:transparent; color:var(--primary)}
  .mine .msg{min-height:1em; font-size:12.5px; color:var(--muted)}
  .mine .msg.err{color:var(--error)}
</style>
</head>
<body>
<div class="shell">

<div class="topbar">
  <img src="/assets/laif-logo.svg" alt="Luxembourg AI Factory"/>
  <span class="rule"></span>
  <h1>AI Assessment Sandbox Configurator</h1>
  <span class="session"><b id="who">&hellip;</b><a href="/oauth2/sign_out?rd=%2F">sign out</a></span>
  <details class="menu">
    <summary>
      Manage
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="panel">
      <a data-origin="keycloak" data-path="/realms/aisc/account">My account</a>
    </div>
  </details>
</div>

<main>
  <section class="mine" id="my-tasks" hidden>
    <h2>My tasks</h2>
    <div id="my-lists"></div>
    <span class="msg" id="my-msg" role="status"></span>
  </section>
  <div class="stage">
    <div class="head">
      <h2>Projects</h2>
      <button class="newbtn" id="new-project">Create project</button>
    </div>
    <div class="projects" id="projects"></div>
  </div>
</main>

</div>

<dialog class="new" id="dialog">
  <form id="new-form">
    <h3>Create project</h3>
    <label>Name
      <input name="name" required autocomplete="off" placeholder="MicroCredit Assist Score (MCAS)"/>
    </label>
    <label>Description (optional)
      <textarea name="description" rows="2" placeholder="What is being assessed"></textarea>
    </label>
    <span class="err" id="err"></span>
    <div class="row">
      <button type="button" class="newbtn ghost" id="cancel">Cancel</button>
      <button type="submit" class="newbtn">Create</button>
    </div>
  </form>
</dialog>

<script src="/assets/origins.js"></script>
<script src="/assets/page.js"></script>
<script src="/assets/work.js"></script>
<script>
  // My tasks: the parts I hold, what is offered to me, what waits for my sign-off, what was sent back to me, and
  // the parts nobody holds that I could take, across my projects, as the platform lists them (GET /work/mine).
  (function () {
    var w = aiscWork;
    var enc = encodeURIComponent;
    var box = document.getElementById('my-tasks');
    var lists = document.getElementById('my-lists');
    var said = document.getElementById('my-msg');

    function boardLink(row) {
      var a = w.el('a', 'Work board');
      a.href = '/work.html?project=' + enc(row.project);
      return a;
    }

    function act(path, done) {
      return aisc.call(path, {method: 'POST'}).then(function (answer) {
        if (!answer.ok) { w.say(said, answer.message, true); return; }
        w.say(said, done);
        load();
      });
    }

    function line(row, words) {
      var li = w.el('li');
      li.appendChild(w.el('span', words));
      li.appendChild(w.el('span', row.project_name + ', ' + row.kind_label, 'where'));
      return li;
    }

    var SECTIONS = [
      ['held', 'Parts I hold', function (row) {
        var li = line(row, row.label + (row.since ? ', since ' + w.when(row.since) : ''));
        li.appendChild(boardLink(row));
        return li;
      }],
      ['offered', 'Offered to me', function (row) {
        var li = line(row, row.label + ', offered by ' + row.holder_name);
        var path = w.partPath(row.project, row.kind, row.subject, row.part);
        var yes = w.button('Accept'), no = w.button('Decline', true);
        yes.addEventListener('click', function () { act(path + '/accept', 'You hold ' + row.label + '.'); });
        no.addEventListener('click', function () { act(path + '/decline', row.label + ' stays with ' + row.holder_name + '.'); });
        li.appendChild(yes); li.appendChild(no);
        return li;
      }],
      ['to_sign', 'Waiting for my sign-off', function (row) {
        var li = line(row, 'Submitted by ' + row.submitted_by_name + ', ' + w.when(row.submitted_at));
        var a = w.el('a', 'Sign off');
        a.href = w.signPage(row.project, row.kind, row.subject);
        li.appendChild(a);
        return li;
      }],
      ['sent_back', 'Sent back to me', function (row) {
        var li = line(row, row.by + ' sent it back: ' + row.reason);
        li.appendChild(boardLink(row));
        return li;
      }],
      ['takeable', 'Parts nobody holds that I could take', function (row) {
        var li = line(row, row.label);
        var take = w.button('Take');
        take.addEventListener('click', function () {
          act(w.partPath(row.project, row.kind, row.subject, row.part) + '/take', 'You hold ' + row.label + '.');
        });
        li.appendChild(take);
        return li;
      }]
    ];

    function render(mine) {
      lists.textContent = '';
      var any = false;
      SECTIONS.forEach(function (section) {
        var rows = mine[section[0]] || [];
        if (!rows.length) return;
        any = true;
        lists.appendChild(w.el('h3', section[1]));
        var ul = w.el('ul');
        rows.forEach(function (row) { ul.appendChild(section[2](row)); });
        lists.appendChild(ul);
      });
      if (!any) lists.appendChild(w.el('p', 'Nothing waits for you: you hold no part and no task waits for your sign-off.'));
      box.hidden = false;
    }

    function load() {
      return aisc.call('/api/work/mine').then(function (answer) {
        if (!answer.ok) {
          lists.textContent = '';
          w.say(said, 'Your tasks could not be read: ' + answer.message, true);
          box.hidden = false;
          return;
        }
        render(answer.data);
      });
    }
    load();
  })();
</script>
<script>
  var list = document.getElementById('projects');
  var dialog = document.getElementById('dialog');

  function when(iso) {
    try { return new Date(iso).toISOString().slice(0, 10); } catch (e) { return ''; }
  }

  var listed = {};   // the slugs the page listed when it opened: a create that found one of them made nothing new

  function render(projects) {
    projects.forEach(function (p) { if (p && p.slug) listed[p.slug] = true; });
    if (!projects.length) {
      list.innerHTML = '<div class="empty">No projects yet. Create one to begin an assessment.</div>';
      return;
    }
    list.innerHTML = projects.map(function (p) {
      var desc = p.description ? '<p></p>' : '';
      var card = document.createElement('a');
      card.className = 'project';
      card.href = '/p/' + encodeURIComponent(p.slug);
      card.innerHTML = '<span class="slug"></span><h3></h3>' + desc
        + '<time></time>';
      card.querySelector('.slug').textContent = p.slug;
      card.querySelector('h3').textContent = p.name;
      if (p.description) card.querySelector('p').textContent = p.description;
      card.querySelector('time').textContent = when(p.created_at);
      return card.outerHTML;
    }).join('');
  }

  // a refusal (500, 403, 503) is not an empty list: say so, or someone creates a project that exists
  aisc.call('/api/projects')
    .then(function (answer) {
      if (!answer.ok) { var e = new Error('refused'); e.status = answer.status; throw e; }
      return answer.data;
    })
    .then(render)
    .catch(function (e) {
      list.innerHTML = '<div class="empty">' + (e && e.status
        ? 'The platform service answered ' + Number(e.status) + ': the projects could not be listed.'
        : 'Could not reach the platform service.') + '</div>';
    });

  document.getElementById('new-project').addEventListener('click', function () { dialog.showModal(); });
  document.getElementById('cancel').addEventListener('click', function () { dialog.close(); });

  function openProject(slug) { window.location.href = '/p/' + encodeURIComponent(slug); }

  // Nothing answered, or the gateway gave up (a create makes a database and a bucket, so it can be slow): the
  // project may exist all the same, so the list is read again before saying it was not created.
  function afterNoAnswer(name, status) {
    var said = (status ? 'The platform did not confirm the create (HTTP ' + status + ')'
                       : 'The platform is not answering') + ', and no project named ' + name
               + ' is listed yet. Reload the page in a moment before trying again.';
    return aisc.call('/api/projects')
      .then(function (answer) {
        var made = ((answer.ok && answer.data) || []).filter(function (p) { return p && p.name === name && !listed[p.slug]; })[0];
        if (made) { openProject(made.slug); return null; }
        return said;
      });
  }

  var creating = false;
  document.getElementById('new-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (creating) return;   // one create at a time: a second click sends nothing
    var err = document.getElementById('err');
    var button = document.querySelector('#new-form button[type="submit"]');
    var data = new FormData(e.target);
    var name = String(data.get('name') || '').trim();
    creating = true;
    if (button) button.disabled = true;
    err.textContent = 'Creating the project\u2026';
    function done(text) {
      creating = false;
      if (button) button.disabled = false;
      err.textContent = text || '';
    }
    aisc.call('/api/projects', {method: 'POST', body: {name: name, description: data.get('description') || null}})
      .then(function (r) {
        if (!r.status) return afterNoAnswer(name, 0).then(done);
        var body = r.data;
        if (r.ok && body && body.slug) { openProject(body.slug); return; }
        // a platform that answered in words said what happened (a 503 that made nothing says so): its sentence,
        // or its field errors listed (FastAPI's 422)
        var worded = body && body.detail;
        if ((r.status >= 500 && !worded) || (r.ok && !(body && body.slug))) return afterNoAnswer(name, r.status).then(done);
        done(worded ? r.message : 'The project could not be created (HTTP ' + r.status + ').');
      });
  });
</script>
<script>
  document.addEventListener('click', function (e) {
    var menu = document.querySelector('.menu');
    if (menu && menu.open && !menu.contains(e.target)) menu.open = false;
  });
  document.addEventListener('keydown', function (e) {
    var menu = document.querySelector('.menu');
    if (e.key === 'Escape' && menu) menu.open = false;
  });

  aisc.call('/oauth2/userinfo')
    .then(function(r){ return r.ok ? r.data : null; })
    .then(function(d){
      if (d) document.getElementById('who').textContent =
        d.preferredUsername || d.user || d.email || 'user';
    })
    .catch(function(){});
</script>
</body>
</html>
