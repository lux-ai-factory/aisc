<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Assessment Sandbox - AI Assessment Sandbox Configurator</title>
<link rel="icon" href="/assets/laif-logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  /* The launcher's look (homepage/project.html): same tokens, header and session line.
     Everything this page decides is decided by the platform; the page only shows it. */
  :root{
    --bg:#fbfbfd; --panel:#ffffff;
    --text:#000000; --muted:#474c60; --faint:#6b7288;
    --primary:#000fdf; --primary-hover:#000079;
    --accent:#ff007e;
    --border:#d3d8e6; --border-strong:#a9b0c6;
    --radius:0px;
    --gutter:40px;
    --col-centre:calc((100% - 2 * var(--gutter)) / 6);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --error:#b3123c;
    --ok:#0a7a45;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    position:relative; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(to right, rgba(0,15,223,.065) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,15,223,.065) 1px, transparent 1px);
    background-size:40px 40px;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 42%, #000 35%, transparent 100%);
            mask-image:radial-gradient(ellipse 90% 70% at 50% 42%, #000 35%, transparent 100%);
  }
  .shell{position:relative; z-index:1}

  /* ---- header ---- */
  .topbar{
    display:flex; align-items:center; gap:22px;
    padding:16px 32px; border-bottom:1px solid var(--border);
    background:rgba(255,255,255,.82); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:10;
  }
  .topbar img{height:32px; width:auto; display:block}
  .topbar .back{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--primary); text-decoration:none; border:1px solid var(--border-strong);
    padding:7px 11px; white-space:nowrap;
  }
  .topbar .back:hover{background:var(--primary); color:#fff; border-color:var(--primary)}
  .topbar .rule{width:1px; height:28px; background:var(--border-strong)}
  .topbar h1{
    margin:0; font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.14em; color:var(--text);
  }
  .session{
    margin-left:auto;
    display:flex; align-items:center; gap:14px;
    font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap;
  }
  .session b{color:var(--text); font-weight:500}
  .session a{color:var(--primary); text-decoration:none; border-bottom:1px solid transparent}
  .session a:hover{border-bottom-color:var(--primary)}

  main{max-width:none; margin:0 auto; padding:40px 32px 64px}   /* the whole page width (2026-10-03) */
  .title{margin:0 0 4px; font-size:26px; font-weight:600; letter-spacing:-.02em}
  .subtitle{margin:0 0 30px; font-family:var(--mono); font-size:11.5px; color:var(--muted)}
  /* the project name, and the Reports button at the top right level with it (2026-10-03) */
  .title-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
  a.reports{display:inline-flex; align-items:center; padding:12px 26px; background:var(--accent); color:#fff;
            text-decoration:none; font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.1em;
            text-transform:uppercase}
  a.reports:hover{background:#c40061}
  .note{
    margin:0 0 22px; padding:12px 14px; border-left:3px solid var(--border-strong);
    color:var(--muted); font-size:13px; background:rgba(0,15,223,.02);
  }
  section{margin-top:34px}
  section h2{
    margin:0 0 6px; font-size:13px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
  }
  section > p{margin:0 0 16px; color:var(--muted); font-size:13.5px; max-width:80ch}

  /* the hidden attribute wins over any display rule */
  [hidden]{display:none !important}
  /* ---- the three ways on ---- */
  .ways{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); align-items:start; gap:24px; margin:4px 0 8px}
  .way-col{display:flex; flex-direction:column; gap:12px; min-width:0}
  a.way{
    display:flex; align-items:center; justify-content:center; min-height:96px; padding:26px 34px; text-decoration:none;
    border:1px solid var(--primary); background:var(--primary); color:#fff;
    font-family:var(--mono); font-size:20px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  }
  /* step 4 test tiles (2026-10-03): one per installed test, under Execute tests */
  .tiles{display:flex; flex-direction:column; gap:8px}
  .tile{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border);
        border-left:4px solid var(--primary); background:var(--panel)}
  .tile-main{flex:1; min-width:0}
  .tile-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tile-runs{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:3px}
  .tile-runs .failed{color:#b02424}
  .tile-runs .running{color:var(--primary)}
  a.tile-btn{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
             border:1px solid var(--primary); color:var(--primary); background:var(--panel); text-decoration:none;
             font-family:var(--mono); font-weight:700}
  a.tile-btn:hover{background:var(--primary); color:#fff}
  a.tile-open{width:auto; padding:0 12px; font-size:12px; letter-spacing:.06em; text-transform:uppercase}
  .tile-bar{height:4px; background:var(--border); margin-top:6px}
  .tile-bar > span{display:block; height:100%; background:var(--primary)}
  a.tile-link{color:inherit; text-decoration:none}
  a.tile-link:hover{border-color:var(--primary)}
  .tile-kind{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--primary)}
  .tile.is-off{background:#f3f4f8; border-left-color:var(--border-strong); border-style:dashed; color:var(--muted)}
  .tile.is-off .tile-kind{color:var(--muted)}
  .tile-go{color:var(--primary); font-size:18px}
  .tile-off{font-size:12px; color:var(--muted); font-style:italic}
  .tiles .empty{margin:0; font-size:13px; color:var(--muted)}
  a.way:hover{background:var(--primary-hover); border-color:var(--primary-hover)}
  /* Visualisation: the targets with runs on top, the others folded away under "Not run yet" (2026-10-04) */
  details.idle{margin-top:4px}
  details.idle summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; padding:6px 2px;
                       font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--muted)}
  details.idle summary::-webkit-details-marker{display:none}
  details.idle summary::before{content:"\25B8"; color:var(--primary); font-size:13px}
  details.idle[open] summary::before{content:"\25BE"}
  details.idle summary:hover{color:var(--primary)}
  details.idle .tiles{margin-top:6px}
  .version-bar{display:flex; align-items:center; gap:10px; margin:8px 0 0}
  .version-bar label{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  select.version{font:inherit; font-size:14px; font-weight:700; color:var(--text); background:var(--panel);
                 border:1px solid var(--border); border-radius:6px; padding:6px 12px; cursor:pointer}
  .empty{padding:18px; color:var(--muted); font-size:13.5px}

  @media (max-width:820px){
    .topbar{padding:12px 18px; gap:14px}
    main{padding:28px 18px 40px}
    .ways{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="shell">

<div class="topbar">
  <a class="back" id="back" href="/" aria-label="Back to the project">&larr; Project</a>
  <img src="/assets/laif-logo.svg" alt="Luxembourg AI Factory"/>
  <span class="rule"></span>
  <h1>AI Assessment Sandbox Configurator</h1>
  <span class="session"><b id="who">&hellip;</b><a href="/oauth2/sign_out?rd=%2F">sign out</a></span>
</div>

<main>
  <div class="title-row">
    <h1 class="title" id="project-name">&hellip;</h1>
    <a class="reports" id="reports" href="http://localhost/report-composer/">Reports</a>
  </div>
  <p class="subtitle">AI Assessment Sandbox</p>
  <div class="version-bar" hidden id="version-bar">
    <label for="version">AI card version</label>
    <select class="version" id="version" aria-label="AI card version"></select>
  </div>
  <p class="note" id="page-message" hidden></p>

  <section>
    <h2>Collect the evidence</h2>
    <div class="ways">
      <div class="way-col">
        <a class="way" id="address-controls" href="http://localhost/controls">Address controls</a>
        <div class="tiles" id="control-tiles" aria-label="Installed checklists"></div>
      </div>
      <div class="way-col">
        <a class="way" id="execute-tests" href="http://localhost/">Execute tests</a>
        <div class="tiles" id="test-tiles" aria-label="Installed tests"></div>
      </div>
      <div class="way-col">
        <a class="way" id="visualise" href="http://localhost:8188/">Visualisation</a>
        <div class="tiles" id="target-tiles" aria-label="The system and its components"></div>
      </div>
    </div>
  </section>

</main>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var slug = params.get('project') || '';
  // the AI card version shown (the tiles count its runs); none is the latest
  var version = params.get('version');
  var enc = encodeURIComponent;
  var NOT_ANSWERING = 'The platform is not answering.';
  var data = null;                          // the platform's answer: tests, controls, targets, versions
  var pid = '';                             // the project's pid: the engine's pages take it as ?project=
  var ENGINE = 'http://localhost';          // the engine web app, as the launcher's other pages name it
  var CONTROLS = 'http://localhost/controls';  // the controls app

  function api(path, opts) {
    opts = opts || {};
    return fetch(path, {
      method: opts.method || 'GET',
      credentials: 'same-origin',
      headers: opts.body ? {'Content-Type': 'application/json'} : {},
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }
  function bodyOf(res) { return res.json().catch(function () { return null; }); }
  function refusal(res, d) {
    if (d && typeof d.detail === 'string') return d.detail;
    if (d && Array.isArray(d.detail)) return d.detail.map(function (e) { return (e.loc || []).slice(-1)[0] + ': ' + e.msg; }).join('; ');
    return 'Refused (HTTP ' + res.status + ')';
  }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }
  function show(id, text) { var node = $(id); if (text !== undefined) node.textContent = text; node.hidden = false; }

  // one tile per installed test (2026-10-03): C opens its configuration, E the execution page on it, and
  // its runs on the card version shown. A removed test, kept only for its links, has no runs and no tile.
  // One per engine plugin (2026-10-04): a package may ship several, as data-monitor ships Data Drift and
  // Data Anomaly; a platform from before sends only the per-package list.
  function renderTiles() {
    var box = $('test-tiles');
    box.textContent = '';
    var tests = (data.plugins || data.tests || []).filter(function (it) { return it.runs; });
    if (!tests.length) {
      box.appendChild(el('p', 'empty', 'No tests installed yet: pick them in step 3, the catalogue.'));
      return;
    }
    tests.forEach(function (it) {
      var tile = el('div', 'tile'), main = el('div', 'tile-main');
      main.appendChild(el('div', 'tile-name', it.label));
      if (it.stale === 'disabled') main.appendChild(el('div', 'tile-off', 'Disabled in the engine'));
      var runs = el('div', 'tile-runs');
      runs.appendChild(el('span', null, it.runs.executed + ' executed'));
      runs.appendChild(document.createTextNode(' · '));
      runs.appendChild(el('span', it.runs.failed ? 'failed' : null, it.runs.failed + ' failed'));
      runs.appendChild(document.createTextNode(' · '));
      runs.appendChild(el('span', it.runs.running ? 'running' : null, it.runs.running + ' running'));
      main.appendChild(runs);
      tile.appendChild(main);
      if (data.engine_workspace && it.engine_name) {
        tile.appendChild(tileLink('C', 'Configure ' + it.label,
          ENGINE + '/projects/' + enc(data.engine_workspace) + '/plugins/' + enc(it.engine_name) + '?project=' + enc(pid)));
        // the execution page lists only the enabled tests
        if (it.stale !== 'disabled') tile.appendChild(tileLink('E', 'Execute ' + it.label,
          ENGINE + '/projects/' + enc(data.engine_workspace) + '/plugins/evaluation?project=' + enc(pid) + '&plugin=' + enc(it.engine_name)));
      }
      box.appendChild(tile);
    });
  }

  function tileLink(letter, title, href) {
    var a = el('a', 'tile-btn', letter);
    a.href = href; a.title = title; a.setAttribute('aria-label', title);
    return a;
  }

  // one tile per installed checklist (2026-10-03): its latest answers as the controls app lists them, the
  // version, its coverage (answered out of all questions) and readiness, and a button to them (or to the checklist, when
  // it was never answered). A deleted checklist, kept only for its links, has no questions and no tile.
  function renderControlTiles() {
    var box = $('control-tiles');
    box.textContent = '';
    // a platform from before 2026-10-03 sends no question counts: no tiles rather than a wrong "none installed"
    if ((data.controls || []).some(function (it) { return it.questions === undefined; })) return;
    var checklists = (data.controls || []).filter(function (it) { return it.questions !== null && it.questions !== undefined; });
    if (!checklists.length) {
      box.appendChild(el('p', 'empty', 'No checklists installed yet: pick them in step 3, the catalogue.'));
      return;
    }
    checklists.forEach(function (it) {
      var tile = el('div', 'tile'), main = el('div', 'tile-main'), sub = it.submission;
      main.appendChild(el('div', 'tile-name', it.label));
      var href;
      if (sub) {
        var done = it.questions ? Math.round(100 * sub.answered / it.questions) : 0;
        main.appendChild(el('div', 'tile-runs', 'v' + sub.version + ' · ' + sub.status + ' · coverage ' +
          sub.answered + '/' + it.questions + ' (' + done + '%) · readiness ' +
          (sub.readiness === null ? '–' : sub.readiness + '%')));
        var bar = el('div', 'tile-bar'), fill = el('span');
        fill.style.width = done + '%';
        bar.appendChild(fill);
        main.appendChild(bar);
        href = CONTROLS + '/p/' + enc(pid) + '/submissions/' + enc(sub.id);
      } else {
        main.appendChild(el('div', 'tile-runs', 'Not answered yet' + ' · ' + plural(it.questions, 'question')));
        href = CONTROLS + '/p/' + enc(pid) + '/checklists/' + enc(it.key) + '/fill';
      }
      tile.appendChild(main);
      var open = tileLink('Open', 'Open ' + it.label, href);
      open.classList.add('tile-open');
      tile.appendChild(open);
      box.appendChild(tile);
    });
  }

  // one tile per assessment target under Visualisation (results navigation 2026-10-03): the system,
  // its components and, when some runs have none, "No target"; each opens the results page of its
  // target, which lists its tools. Those with runs on this card version come first; those without
  // are greyed, no link, and folded away under "Not run yet", closed until opened (2026-10-04).
  function renderTargetTiles() {
    var box = $('target-tiles');
    box.textContent = '';
    if (!data.targets) return;
    var on = [], off = [];
    data.targets.forEach(function (t) {
      var runs = 0, failed = 0;
      t.tools.forEach(function (it) { runs += it.executed + it.failed + it.running; failed += it.failed; });
      var kind = t.kind === 'system' ? 'SYSTEM' : t.kind === 'unassigned' ? 'NO TARGET'
        : (t.component_kind || 'component').replace(/_/g, ' ').toUpperCase();
      var main = el('div', 'tile-main');
      main.appendChild(el('div', 'tile-kind', kind));
      main.appendChild(el('div', 'tile-name', t.label));
      var tile;
      if (!runs) {
        tile = el('div', 'tile is-off');
        main.appendChild(el('div', 'tile-runs', t.stale ? 'Not in the latest card' : 'No runs yet'));
        tile.appendChild(main);
        off.push(tile);
      } else {
        tile = el('a', 'tile tile-link');
        tile.href = '/results.html?project=' + enc(slug) + '&target=' + enc(t.key === null ? 'none' : t.key) +
          (version ? '&version=' + enc(version) : '');
        main.appendChild(el('div', 'tile-runs', plural(t.tools.length, 'tool') + ' · ' + plural(runs, 'run') +
          (failed ? ' · ' + failed + ' failed' : '')));
        tile.appendChild(main);
        tile.appendChild(el('span', 'tile-go', '→'));
        on.push(tile);
      }
    });
    on.forEach(function (tile) { box.appendChild(tile); });
    if (off.length) {
      var idle = el('details', 'idle'), list = el('div', 'tiles');
      idle.appendChild(el('summary', null, 'Not run yet (' + off.length + ')'));
      off.forEach(function (tile) { list.appendChild(tile); });
      idle.appendChild(list);
      box.appendChild(idle);
    }
  }

  function render() {
    renderTiles();
    renderControlTiles();
    renderTargetTiles();
  }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  function load() {
    return api('/api/projects/' + enc(slug) + '/evidence' + (version ? '?version=' + enc(version) : ''))
      .then(function (res) { return bodyOf(res).then(function (d) { return {res: res, d: d}; }); })
      .then(function (r) {
        if (!r.res.ok) { show('page-message', refusal(r.res, r.d)); return; }
        data = r.d;
        versionBar();
        render();
      });
  }

  // which card version this is, and the others to look at
  function versionBar() {
    var select = $('version');
    select.textContent = '';
    var all = data.versions || [];          // a platform from before 2026-10-02 sends none
    all.forEach(function (v, i) {
      var option = el('option', null, 'Version ' + v.number + (i === 0 ? ' (latest)' : ''));
      option.value = v.pid;
      if (data.version && v.pid === data.version.pid) option.selected = true;
      select.appendChild(option);
    });
    $('version-bar').hidden = !all.length;
  }

  function boot() {
    $('back').href = '/p/' + enc(slug);
    $('version').addEventListener('change', function () {
      var picked = $('version').value, latest = data.versions[0].pid;
      location.search = '?project=' + enc(slug) + (picked === latest ? '' : '&version=' + enc(picked));
    });
    api('/api/projects/' + enc(slug))
      .then(function (res) {
        if (!res.ok) { show('page-message', 'No project with the handle ' + slug + '.'); return null; }
        return res.json();
      })
      .then(function (p) {
        if (!p) return null;
        $('project-name').textContent = p.name;
        document.title = p.name + ' - AI Assessment Sandbox';
        $('reports').href = 'http://localhost/report-composer/p/' + enc(p.pid);
        // the engine takes the project as a query; the controls app has it in the path
        pid = p.pid;
        $('execute-tests').href = 'http://localhost/?project=' + enc(p.pid);
        $('address-controls').href = 'http://localhost/controls/p/' + enc(p.pid);
        // one tile per plugin, synced by the platform before it opens them (plugin dashboards 2026-10-04)
        $('visualise').href = '/api/projects/' + enc(slug) + '/dashboards/open';
        return load();
      })
      .catch(function () { show('page-message', NOT_ANSWERING); });
    fetch('/oauth2/userinfo', {credentials: 'same-origin'})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { $('who').textContent = d ? (d.preferredUsername || d.user || d.email || 'user') : 'signed in'; })
      .catch(function () { $('who').textContent = 'signed in'; });
  }
  boot();
</script>
</body>
</html>
