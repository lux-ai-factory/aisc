# The execution engine on its own: no Configurator services (platform, its projects, the
# Caddy gateway) and no AISC_DEPLOYMENT. Without it, aisc_backend/deployment.py and
# aisc_eval/deployment.py both default to standalone (one database holding all projects, which
# are created in the engine), and so does the webapp image's APP_DEPLOYMENT
# (apps/webapp/Dockerfile).
#
# No secret has a default: port 8000 is published with no gateway in front, so a shipped
# INTERNAL_API_KEY would open /api/v1/internal/* to anyone. Give them in an env file (see
# README.md, "Two deployment modes"): docker compose --env-file <file> -f <this file> up --build
#
# The engine's own Dockerfile CMD runs `manage.py migrate --noinput` before it serves, so
# there is no separate migrate one-shot here (that one-shot, and the per-project
# migrate_projects command, belong to the Configurator: see docker-compose.development.yml).
#
# Run: docker compose --env-file env.engine-standalone -f docker-compose.engine-standalone.yml up --build
# The webapp is on http://localhost:8080, the API on http://localhost:8000, both on 127.0.0.1 only:
# standalone has no sign-in.

# Every service's log is rotated at 10 MB, five files kept, and every service runs within memory, CPU and process
# limits in one of three sizes: small for the proxies and caches, large for the engine, the databases, Keycloak, the
# dashboard and the agents, medium for the rest (the one-shots included). The workers set their own limits.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
x-size-small: &size-small
  logging: *logging
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 128
x-size-medium: &size-medium
  logging: *logging
  mem_limit: 1g
  cpus: 1.0
  pids_limit: 256
x-size-large: &size-large
  logging: *logging
  mem_limit: 2g
  cpus: 2.0
  pids_limit: 512

services:
  aisc-backend:
    <<: *size-large
    build: apps/backend/
    image: aisc-backend:${AISC_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX:-}aisc-backend-standalone
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-aisc}
      DB_USER: ${DB_USER:-aisc}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      S3_URL: http://minio:9000
      S3_USER: ${S3_USER:-s3-user}
      S3_PASSWORD: ${S3_PASSWORD:?set S3_PASSWORD}
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET:-models}
      S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET:-datasets}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-artifacts}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USERNAME:-rabbit-user}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672//
      REDIS_BACKEND_URL: redis://redis:6379
      PLUGIN_PATH: /app/plugins   # where the volume below mounts ${PLUGIN_PATH:-./def_plugins}
      PACKAGE_REGISTRY_URL: http://devpi:3141
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER:-}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD:-}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX:-root/public}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      MODEL_LISTING_SSL_VERIFY: ${MODEL_LISTING_SSL_VERIFY:-True}
      # the access rule every service shares (shared/identity), imported by the engine's door
      PYTHONPATH: /app/shared/identity
    ports:
      # loopback only: the standalone engine has no sign-in, so whoever reaches this port can create
      # projects and run plugins
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ${PLUGIN_PATH:-./def_plugins}:/app/plugins:z
      - ./shared/identity:/app/shared/identity:ro,z
    networks:
      - engine-standalone

  aisc-eval-worker:
    logging: *logging
    platform: linux/amd64
    build:
      context: apps/eval/
    image: aisc-eval:${AISC_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX:-}aisc-eval-worker-standalone
    # the pool this worker leases from, read by another install's start so the two never share a uid
    labels:
      aisc.run-uids: "${PLUGIN_RUN_UIDS:-10100-10199}"
    environment: &eval-worker-env
      API_URL: http://aisc-backend:8000
      API_PREFIX: ${API_PREFIX:-/api/v1/internal}
      REDIS_BACKEND_URL: redis://redis:6379
      CELERY_BROKER_URL: amqp://${RABBITMQ_USERNAME:-rabbit-user}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672//
      CORS_ORIGINS: "*"
      PLUGIN_PATH: /app/plugins   # where the volume below mounts ${PLUGIN_PATH:-./def_plugins}
      PACKAGE_REGISTRY_URL: http://devpi:3141
      PACKAGE_REGISTRY_USER: ${PACKAGE_REGISTRY_USER:-}
      PACKAGE_REGISTRY_PASSWORD: ${PACKAGE_REGISTRY_PASSWORD:-}
      PACKAGE_REGISTRY_INDEX: ${PACKAGE_REGISTRY_INDEX:-root/public}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      # what a plugin may reach through the worker's egress proxy (aisc_eval/egress.py): host, host:port or
      # .domain, comma separated; unset, raw.githubusercontent.com (StrongREJECT's datasets); set empty, none
      PLUGIN_EGRESS_ALLOWED_HOSTS: ${PLUGIN_EGRESS_ALLOWED_HOSTS-raw.githubusercontent.com}
      # the uids this worker runs plugins as (aisc_eval/plugin_process.py): the declarations worker has its own,
      # never overlapping, since the kernel counts a uid's processes across containers. Each install has its own
      # pools, chosen by start and kept in env.local (scripts/aisc/run_uids.py)
      PLUGIN_RUN_UIDS: "${PLUGIN_RUN_UIDS:-10100-10199}"
    # the worker's size, as in the Configurator's file: every process and thread inside counts against pids_limit
    mem_limit: ${EVAL_WORKER_MEM_LIMIT:-16g}
    cpus: ${EVAL_WORKER_CPUS:-4}
    pids_limit: 2048
    # only to set, at start, the firewall that keeps plugin tests behind the egress proxy
    cap_add: &eval-worker-capabilities
      - NET_ADMIN
    init: true
    depends_on:
      - aisc-backend
      - rabbitmq
      - redis
    volumes: &eval-worker-volumes
      - ${PLUGIN_PATH:-./def_plugins}:/app/plugins:z
    networks: &eval-worker-networks
      - engine-standalone

  # The eval worker's second process: it reads plugin manifests and runs the plugins' form hooks
  # (aisc_eval.celery_app.PLUGIN_DECLARATIONS_QUEUE), one at a time, so a configure page never waits behind
  # the runs. It runs plugin code as the run worker does, so it is kept apart the same way (same image,
  # settings, firewall, reaper and egress hosts; no database credential).
  aisc-eval-declarations-worker:
    logging: *logging
    platform: linux/amd64
    # the run worker's image, built there (two builds of one tag race)
    image: aisc-eval:${AISC_IMAGE_TAG:-latest}
    pull_policy: never
    container_name: ${CONTAINER_PREFIX:-}aisc-eval-declarations-worker-standalone
    environment:
      <<: *eval-worker-env
      # a run-uid pool of its own, apart from the run worker's: one task at a time needs one uid
      PLUGIN_RUN_UIDS: "${PLUGIN_DECLARATIONS_RUN_UIDS:-10200-10209}"
    # one plugin at a time: its install, then its manifest or one form hook
    mem_limit: ${EVAL_DECLARATIONS_WORKER_MEM_LIMIT:-8g}
    cpus: ${EVAL_DECLARATIONS_WORKER_CPUS:-2}
    pids_limit: 1024
    cap_add: *eval-worker-capabilities
    init: true
    depends_on:
      - aisc-eval-worker
      - aisc-backend
      - rabbitmq
      - redis
    volumes: *eval-worker-volumes
    networks: *eval-worker-networks
    command: ["uv", "run", "celery", "-A", "aisc_eval.celery_worker:celery_app", "worker", "--loglevel=info",
              "--queues=plugin-declarations", "--concurrency=1"]

  aisc-webapp:
    <<: *size-small
    build: apps/webapp/
    image: aisc-webapp:${AISC_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX:-}aisc-webapp-standalone
    environment:
      APP_API_URL: ${API_URL_EXTERNAL:-http://localhost:8000}
      APP_SHOW_PLUGIN_VISUALIZATION: ${SHOW_PLUGIN_VISUALIZATION:-true}
    ports:
      - "127.0.0.1:8080:80"   # loopback only, like the API it calls
    depends_on:
      - aisc-backend
    networks:
      - engine-standalone

  # Infrastructure, as in the engine's own docker-compose-infra.yml
  # Hands MinIO's volume to MinIO's user (uid 10030) before MinIO starts: a volume an older install made as root
  # would otherwise stop the server. Changes nothing once the folder is MinIO's; no network.
  minio-data-owner:
    <<: *size-medium
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    # no build: the same image as minio, built once there
    pull_policy: never
    user: "0"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - engine_minio_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: ['[ "$$(stat -c %u /data)" = 10030 ] || chown -R 10030:10030 /data']
    restart: "no"

  minio:
    <<: *size-medium
    # built from source (infra/minio/Dockerfile): MinIO no longer publishes community images
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    build: ./infra/minio
    pull_policy: never
    container_name: ${CONTAINER_PREFIX:-}minio-standalone
    # its own user (the image's minio); minio-data-owner hands it the volume first
    user: "10030"
    depends_on:
      minio-data-owner:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_USER:-s3-user}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:?set S3_PASSWORD}
    volumes:
      - engine_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - engine-standalone

  make_buckets:
    <<: *size-medium
    # built from source (infra/minio/Dockerfile): MinIO no longer publishes community images
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    # no build: the same image as its main service, built once there (parallel builds of one tag race)
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_USER:-s3-user}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:?set S3_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      /usr/bin/mc mb --ignore-existing minio/datasets;
      /usr/bin/mc mb --ignore-existing minio/artifacts;
      /usr/bin/mc mb --ignore-existing minio/models &&
      exit 0;
      "
    networks:
      - engine-standalone

  rabbitmq:
    <<: *size-medium
    image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: ${CONTAINER_PREFIX:-}rabbitmq-standalone
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-rabbit-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - engine_rabbitmq_data:/var/lib/rabbitmq
      # the consumer timeout above the worker's task limit, so a long test run is never handed out twice
      - ./infra/rabbitmq/conf.d/10-aisc.conf:/etc/rabbitmq/conf.d/10-aisc.conf:ro
    networks:
      - engine-standalone

  redis:
    <<: *size-small
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    container_name: ${CONTAINER_PREFIX:-}redis-standalone
    restart: unless-stopped
    volumes:
      - engine_redis_data:/data
    networks:
      - engine-standalone

  postgres:
    <<: *size-large
    image: postgres:15.19-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81   # a PG14 data dir does not start under 15: fresh volumes
    container_name: ${CONTAINER_PREFIX:-}postgres-standalone
    environment:
      POSTGRES_USER: ${DB_USER:-aisc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-aisc}
    volumes:
      - engine_postgres_data:/var/lib/postgresql/data
    networks:
      - engine-standalone

  # The package index a plugin is installed from (no catalogue runs here).
  # Hands devpi's volume to devpi's user (uid 10001) before devpi starts: a volume an older image filled as root
  # would otherwise stop the server, which no longer starts as root. Changes nothing once the folder is devpi's.
  devpi-data-owner:
    <<: *size-medium
    image: aisc-catalogue-devpi:${AISC_IMAGE_TAG:-latest}
    # no build: the same image as devpi, built once there
    pull_policy: never
    user: "0"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - engine_devpi_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: ['[ "$$(stat -c %u /data)" = 10001 ] || chown -R 10001:10001 /data']
    restart: "no"

  devpi:
    <<: *size-medium
    build: apps/catalogue/devpi
    image: aisc-catalogue-devpi:${AISC_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_PREFIX:-}devpi-standalone
    depends_on:
      devpi-data-owner:
        condition: service_completed_successfully
    environment:
      DEVPI_INDEX: ${DEVPI_INDEX:-root/public}
      DEVPI_ROOT_PASSWORD: ${DEVPI_ROOT_PASSWORD:?set DEVPI_ROOT_PASSWORD}
    volumes:
      - engine_devpi_data:/data
    networks:
      - engine-standalone

volumes:
  engine_minio_data:
  engine_rabbitmq_data:
  engine_redis_data:
  engine_postgres_data:
  engine_devpi_data:

networks:
  engine-standalone:
