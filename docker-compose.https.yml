# Added by aisc.py start for an install served over https (CADDY_DOMAIN starts with https://): Caddy's
# https port. Not in the main files, so an install on plain http never needs 443 free.
services:
  caddy:
    ports:
      # on every interface: aisc.py writes CADDY_BIND_ADDRESS=0.0.0.0 for an install served over https
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:${ENGINE_HTTPS_PORT:-443}:8005"
