[project]
name = "aisc-identity"
version = "0.1.0"
description = "Who is calling, what they may do, and how a change is cited in the ledger: shared by every Python service."
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.111", "httpx>=0.27", "psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aisc_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
