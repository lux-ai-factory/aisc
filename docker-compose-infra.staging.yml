services:
  # Reverse proxy
  caddy:
    image: caddy:2.10.2
    container_name: caddy
    restart: always
    ports:
      - 443:8005
    volumes:
      - /home/deployer/config/caddy:/etc/caddy/:ro
      - /home/deployer/data/caddy:/data
    environment:
      LOG_FILE: "/data/access.log"
      CADDY_DOMAIN: "aisctest.uni.lux"
      CADDY_PORT: "8005"
      CADDY_ENVIRONMENT: "staging"
      # Keycloak on the same origin as the app, under /auth (no DNS/cert for a
      # subdomain). Must include the leading slash; Caddy proxies /auth/* through
      # unchanged (KC_HTTP_RELATIVE_PATH=/auth makes Keycloak serve that prefix).
      CADDY_KEYCLOAK_PATH: "/auth"
    networks:
      - backend
      - frontend
    depends_on:
      - aisc-backend

  # MinIO object storage service
  minio:
    image: quay.io/minio/minio
    container_name: minio
    volumes:
      - minio_data:/data # Persistent storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_USER} # MinIO root username
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD} # MinIO root password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # MinIO bucket initialization service
  make_buckets:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy # Wait for MinIO to be ready
    environment:
      MINIO_ROOT_USER: ${S3_USER} # MinIO credentials for bucket creation
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 ${S3_USER} ${S3_PASSWORD} &&
      /usr/bin/mc mb --ignore-existing minio/datasets;
      /usr/bin/mc mb --ignore-existing minio/artifacts;
      /usr/bin/mc mb --ignore-existing minio/models &&
      exit 0;
      "
    networks:
      - backend

  # RabbitMQ Message queue to send the jobs
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # Persistent storage
    networks:
      - backend

  # Redis collects the results.
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data # Persistent storage
    networks:
      - backend

  # PostgreSQL database service
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistent storage
      # Create Keycloak's own DB on a fresh volume (Keycloak can't create its own database).
      - ./init/keycloak.sql:/docker-entrypoint-initdb.d/30-keycloak.sql:ro
    restart: unless-stopped
    networks:
      - backend

  # Keycloak (SSO) — PRODUCTION mode (`start`), behind Caddy (TLS terminated there).
  # Browser reaches it on the SAME origin as the app: https://aisctest.uni.lux/auth
  # Keycloak serves under KC_HTTP_RELATIVE_PATH=/auth; Caddy passes /auth through
  # UNCHANGED. Do NOT add X-Forwarded-Prefix in Caddy — with proxy-headers=xforwarded
  # it would double the prefix (/auth+auth). For a true prod realm, remove the dev users.
  # NOTE: the realm is imported only on a FRESH keycloak database; an
  # already-imported realm must be updated via the Admin Console instead.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    restart: always
    # Render the realm from the template (APP_URL from env) into the import
    # dir, then start Keycloak — one service, plain `compose up` is enough.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        URL="$${API_URL_EXTERNAL:-http://localhost}"
        mkdir -p /opt/keycloak/data/import
        sed 's|$${API_URL_EXTERNAL}|'"$$URL"'|g' /tmp/aisc-realm.template.json > /opt/keycloak/data/import/aisc-realm.json
        exec /opt/keycloak/bin/kc.sh start --import-realm
    volumes:
      # Realm template (rendered at startup, see command above).
      - ./keycloak/aisc-realm.template.json:/tmp/aisc-realm.template.json:ro
    environment:
      # API_URL_EXTERNAL = public base URL of the app (frontend + API share one
      # Caddy domain). The realm's redirect URIs are rendered from it.
      API_URL_EXTERNAL: ${API_URL_EXTERNAL}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL_EXTERNAL} # public URL the browser uses
      KC_HTTP_RELATIVE_PATH: /auth          # Keycloak serves UNDER /auth (not stripped by Caddy)
      KC_PROXY_HEADERS: xforwarded          # trust Caddy's X-Forwarded-* headers
      KC_HTTP_ENABLED: "true"               # serve HTTP internally; Caddy does the HTTPS
    depends_on:
      - postgres
    networks:
      - backend
      - frontend

volumes:
  minio_data: # Persistent storage for MinIO
  postgres_data: # Persistent storage for PostgreSQL
  rabbitmq_data: # Persistent storage for RabbitMQ
  redis_data: # Persistent storage for Redis

networks:
  backend:
  frontend:
