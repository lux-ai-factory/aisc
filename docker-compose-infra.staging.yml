services:
  # Caddy, the reverse proxy
  caddy:
    image: caddy:2.10.2
    container_name: caddy
    restart: always
    ports:
      - 443:8005
    volumes:
      - /home/deployer/config/caddy:/etc/caddy/:ro
      - /home/deployer/data/caddy:/data
    environment:
      LOG_FILE: "/data/access.log"
      CADDY_DOMAIN: "https://aisctest.uni.lux"
      CADDY_PORT: "8005"
      CADDY_ENVIRONMENT: "staging"
    networks:
      - backend
      - frontend
    depends_on:
      - aisc-backend

  # MinIO, the S3-compatible object storage
  minio:
    # built from source (infra/minio/Dockerfile): MinIO no longer publishes community images
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    build: ./infra/minio
    pull_policy: never
    container_name: minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_USER}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # Creates the buckets once MinIO is up, then exits
  make_buckets:
    # built from source (infra/minio/Dockerfile): MinIO no longer publishes community images
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    build: ./infra/minio
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_USER}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 ${S3_USER} ${S3_PASSWORD} &&
      /usr/bin/mc mb --ignore-existing minio/datasets;
      /usr/bin/mc mb --ignore-existing minio/artifacts;
      /usr/bin/mc mb --ignore-existing minio/models &&
      exit 0;
      "
    networks:
      - backend

  # RabbitMQ, the queue that carries evaluation jobs to the worker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend

  # Redis, where the worker's Celery results are kept
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend

  # PostgreSQL
  postgres:
    image: postgres:15-alpine   # the backend requires PG15; a PG14 data dir needs fresh volumes
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates Keycloak's own database on a fresh volume: Keycloak cannot create it itself.
      - ./init/keycloak.sql:/docker-entrypoint-initdb.d/30-keycloak.sql:ro
    restart: unless-stopped
    networks:
      - backend

  # Keycloak in production mode (`start`), behind Caddy: Caddy terminates TLS, Keycloak speaks HTTP.
  # What a deploy must do on the server, outside this repository:
  #   1. add a DNS record for KEYCLOAK_URL_EXTERNAL and a Caddy route to http://keycloak:8080;
  #   2. the imported realm's client redirect URIs are the localhost ones: add the staging URLs
  #      (https://aisctest.uni.lux/*) to each client in the Keycloak admin, or ship a staging realm file;
  #   3. for a production realm, remove the dev users (admin, user).
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    restart: always
    command: start --import-realm
    volumes:
      - ./keycloak/aisc-realm.json:/opt/keycloak/data/import/aisc-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL_EXTERNAL} # public URL the browser uses
      KC_PROXY_HEADERS: xforwarded          # trust Caddy's X-Forwarded-* headers
      KC_HTTP_ENABLED: "true"               # serve HTTP internally; Caddy does the HTTPS
    depends_on:
      - postgres
    networks:
      - backend
      - frontend

volumes:
  minio_data:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  backend:
  frontend:
