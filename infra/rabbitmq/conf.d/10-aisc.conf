# How long RabbitMQ lets the worker hold a task unacknowledged (ms). The worker acknowledges a task when it ends
# (task_acks_late in apps/eval/aisc_eval/celery_app.py); past this timeout RabbitMQ closes the channel and hands the
# task out again. RabbitMQ's default, 30 min, cut a 78-minute test run. 8 h: above the worker's own hard limit for a
# task (task_time_limit, 6 h 45 min). Checked by scripts/tests/test_rabbitmq_consumer_timeout.py.
consumer_timeout = 28800000
