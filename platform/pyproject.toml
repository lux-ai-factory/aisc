[project]
name = "aisc-platform"
version = "0.1.0"
description = "The platform's projects: defined once, referenced by every module."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the service is a package in this directory, not an installed distribution
pythonpath = ["."]
