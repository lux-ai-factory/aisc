services:
  # Reverse proxy
  caddy:
    image: caddy:2.10.2
    container_name: caddy
    restart: always
    ports:
      - "443:8005"
      - "80:8005"
      # the launcher (see the second site block in the Caddyfile)
      - "${HOMEPAGE_PORT_EXTERNAL:-8100}:8006"
      # the dashboard (Superset), behind the gateway like the rest
      - "${DASHBOARD_PORT_EXTERNAL:-8188}:8008"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./homepage:/srv/homepage:ro,Z
    # so forward_auth can reach oauth2-proxy, which runs on the host network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The ledger's witness (ledger plan 2026-10-02): off until a deploy turns it on; the secret proves
      # a witness call comes from this gateway (spec 3.1, T18).
      LEDGER_GATEWAY: ${LEDGER_GATEWAY:-off}
      AISC_WITNESS_GATEWAY_SECRET: ${AISC_WITNESS_GATEWAY_SECRET:?run scripts/secrets.sh first}
      LOG_FILE: "/data/access.log"
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      CADDY_PORT: "8005"
      HOMEPAGE_PORT: "8006"
      DASHBOARD_PORT: "8008"
      DASHBOARD_UPSTREAM: host.docker.internal:${DASHBOARD_INTERNAL_PORT:-8189}
      CADDY_ENVIRONMENT: ${CADDY_ENVIRONMENT}
    networks:
      - backend
      - frontend
      # to reach pgadmin and schema-docs, which are on no other network (API auth WP3)
      - inspector
    # depends_on:
    #   - aisc-backend

  # MinIO object storage service
  minio:
    # built from source (infra/minio/Dockerfile): MinIO no longer publishes community images
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    build: ./infra/minio
    pull_policy: never
    container_name: minio
    volumes:
      - minio_data:/data # Persistent storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_USER} # MinIO root username
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD} # MinIO root password
    ports:
      - "127.0.0.1:9000:9000"   # loopback only; nothing in a browser talks to MinIO
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # MinIO bucket initialization service
  make_buckets:
    # built from source (infra/minio/Dockerfile): MinIO no longer publishes community images
    image: aisc-minio:${AISC_IMAGE_TAG:-latest}
    build: ./infra/minio
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy # Wait for MinIO to be ready
    environment:
      MINIO_ROOT_USER: ${S3_USER} # MinIO credentials for bucket creation
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 ${S3_USER} ${S3_PASSWORD} &&
      /usr/bin/mc mb --ignore-existing minio/datasets;
      /usr/bin/mc mb --ignore-existing minio/artifacts;
      /usr/bin/mc mb --ignore-existing minio/models &&
      exit 0;
      "
    networks:
      - backend

  # RabbitMQ Message queue to send the jobs
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"   # loopback only
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # Persistent storage
    networks:
      - backend

  # Redis collects the results.
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # loopback only
    volumes:
      - redis_data:/data # Persistent storage
    networks:
      - backend
    command: redis-server --protected-mode no

  # PostgreSQL database service
  postgres:
    image: postgres:15-alpine   # the backend requires PG15 (Meril's 5a05f12); fresh volumes, no data migration
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"   # loopback only; the host-networked dashboard reads here
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistent storage
      # Creates the `keycloak` DB (used by the keycloak service) on a fresh volume.
      - ./init/keycloak.sql:/docker-entrypoint-initdb.d/30-keycloak.sql:ro,Z
      # Creates the platform's own `platform` DB, whose only table is the
      # project every module will come to reference. First, so it exists before
      # any app migrates.
      - ./init/platform-db.sql:/docker-entrypoint-initdb.d/05-platform-db.sql:ro,Z
      # Lets the platform make one database per project. After the platform DB,
      # because it alters the platform's role.
      - ./init/project-databases.sql:/docker-entrypoint-initdb.d/06-project-databases.sql:ro,Z
      # Creates the `superset` metadata DB (apps/results-dashboard) on a fresh volume.
      - ./init/superset-db.sql:/docker-entrypoint-initdb.d/50-superset-db.sql:ro,Z
      # The report's roles (report_ro, report_composer_rw) and the composer's schema.
      # After 50-superset-db.sql, because it grants CONNECT on the superset database.
      - ./init/report-roles.sql:/docker-entrypoint-initdb.d/60-report-roles.sql:ro,Z
      # The database inspector's read-only role, and Keycloak's and Superset's databases closed to
      # PUBLIC. After 50-superset-db.sql, because it closes the superset database.
      - ./init/inspector-role.sql:/docker-entrypoint-initdb.d/70-inspector-role.sql:ro,Z
    restart: unless-stopped
    networks:
      - backend
      # pgadmin and schema-docs read here as inspector_ro (API auth WP3)
      - inspector

  # The same grants on a volume that already exists: initdb scripts only run on
  # an empty one. Idempotent, so it runs on every start and then exits.
  postgres-setup:
    image: postgres:15-alpine
    container_name: postgres-setup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # the report's role passwords (scripts/secrets.sh); the defaults are the role names
      REPORT_RO_PASSWORD: ${REPORT_RO_PASSWORD:?run scripts/secrets.sh first}
      PLATFORM_RW_PASSWORD: ${PLATFORM_RW_PASSWORD:?run scripts/secrets.sh first}
      REPORT_COMPOSER_PASSWORD: ${REPORT_COMPOSER_PASSWORD:?run scripts/secrets.sh first}
      # the database inspector's (scripts/secrets.sh), required
      INSPECTOR_PASSWORD: ${INSPECTOR_PASSWORD:?run scripts/secrets.sh first}
    volumes:
      - ./init/project-databases.sql:/setup/project-databases.sql:ro,Z
      - ./init/report-roles.sql:/setup/report-roles.sql:ro,Z
      - ./init/inspector-role.sql:/setup/inspector-role.sql:ro,Z
      - ./init/platform-role.sql:/setup/platform-role.sql:ro,Z
    command: >
      sh -c "until pg_isready -q; do sleep 1; done
      && psql -v ON_ERROR_STOP=1 -f /setup/project-databases.sql
      && psql -v ON_ERROR_STOP=1 -v report_ro_password=\"$$REPORT_RO_PASSWORD\"
      -v report_composer_password=\"$$REPORT_COMPOSER_PASSWORD\" -f /setup/report-roles.sql
      && psql -v ON_ERROR_STOP=1 -v inspector_password=\"$$INSPECTOR_PASSWORD\" -f /setup/inspector-role.sql
      && psql -v ON_ERROR_STOP=1 -v platform_rw_password=\"$$PLATFORM_RW_PASSWORD\" -f /setup/platform-role.sql"
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend

  # oauth2-proxy — holds the session that makes ONE sign-in cover every module.
  #
  # Caddy asks it about every request with forward_auth: 2xx passes the request
  # through, 401 becomes a redirect to Keycloak. After the login its cookie is
  # set for domain `localhost`, and cookies ignore ports, so the same session
  # covers the platform on :80 and the launcher on :8100.
  #
  # network_mode: host on purpose. The issuer URL it talks to must be the SAME
  # string the browser is redirected to (http://localhost:8081/realms/aisc); from
  # inside a bridge network `localhost` would be the container itself and
  # Keycloak's issuer check would fail.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
    container_name: oauth2-proxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - keycloak
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${KEYCLOAK_URL_EXTERNAL}/realms/aisc
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --skip-provider-button=true
      # The gateway holds the session and refreshes it, so what it protects need
      # not keep a second one. These put the identity and the token it already
      # has on the auth response, which Caddy copies onto the request.
      # The ACCESS token, not the id token: the realm puts a user's roles in the
      # access token, and role-gated endpoints read them from what they verify.
      - --set-xauthrequest=true
      - --pass-access-token=true
      # Keep that session alive while someone is working, rather than letting
      # the realm drop it after its idle timeout behind their back.
      # under the 5-minute token lifespan, so a token never expires mid-request (ledger spec 3.3)
      - --cookie-refresh=4m
      - --email-domain=*
      # the realm's users have no email claim
      - --oidc-email-claim=preferred_username
      - --scope=openid profile
      # Signing out ends the Keycloak session too. Without it /oauth2/sign_out only
      # drops this cookie, and the next page signs the same person straight back in
      # from Keycloak's own session. {id_token} is the session's, filled in by oauth2-proxy.
      - --backend-logout-url=${KEYCLOAK_URL_EXTERNAL}/realms/aisc/protocol/openid-connect/logout?id_token_hint={id_token}
      - --client-id=aisc-gateway
      - --client-secret=${GATEWAY_CLIENT_SECRET:?run scripts/secrets.sh first}
      - --cookie-secret=${GATEWAY_COOKIE_SECRET:?run scripts/secrets.sh first}
      - --cookie-domain=localhost
      - --cookie-secure=false
      - --cookie-samesite=lax
      - --whitelist-domain=localhost
      - --whitelist-domain=localhost:8100
      - --whitelist-domain=localhost:8188
      - --set-xauthrequest=true
      # it proxies nothing itself; Caddy does the proxying
      - --upstream=static://202

  # Keycloak — identity & access management (single login / auth for all apps)
  keycloak:
    # Pin a version. VERIFY the latest stable at https://www.keycloak.org/downloads
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    # --import-realm imports any realm file in /opt/keycloak/data/import/ on startup,
    # but ONLY creates realms that don't already exist (existing realms are left untouched).
    # So on a FRESH keycloak DB this recreates the whole `aisc` realm automatically.
    command: start-dev --import-realm
    volumes:
      # Mount the exported realm into Keycloak's import dir (read-only).
      - ./keycloak/aisc-realm.local.json:/opt/keycloak/data/import/aisc-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    environment:
      # --- first-run admin user for the Keycloak admin console (Keycloak 26+) ---
      # (For Keycloak < 26 these were KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD.)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # --- database: the SHARED Postgres server, Keycloak's OWN 'keycloak' database ---
      KC_DB: postgres                                       # use Postgres as the DB engine
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak   # service-name:port/<the keycloak db>
      KC_DB_USERNAME: ${POSTGRES_USER}                      # reuse the Postgres credentials
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8080"             # host 8081 (8080 is already taken on this machine) -> Keycloak's 8080
    depends_on:
      - postgres                # Keycloak needs its database up first
    networks:
      - backend

  # immudb — the tamper-proof AUDIT LOG ledger. Every app's "who did what" lands here (via the backend's
  # /audit endpoint). Self-contained (its own embedded storage — no external DB needed, unlike Keycloak).
  # Verified vs docs.immudb.io: gRPC 3322, web console 8080, env vars IMMUDB_*, data dir IMMUDB_DIR.
  immudb:
    image: codenotary/immudb:1.11.1     # pinned; latest stable on Docker Hub
    container_name: immudb
    environment:
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD:?run scripts/secrets.sh first}   # env.secrets, never committed
      IMMUDB_FORCE_ADMIN_PASSWORD: "true"               # apply that password at startup (skip change-on-first-login)
      IMMUDB_DIR: /var/lib/immudb                        # data folder (default ./data) -> the mounted volume
      # It signs every state it hands out (ledger spec 7.3): scripts/secrets.sh makes the key once.
      IMMUDB_SIGNINGKEY: /keys/signing.key
    volumes:
      - immudb_data:/var/lib/immudb     # persist the ledger
      - ./immudb-signing.key:/keys/signing.key:ro,Z
    ports:
      # gRPC, bound to the loopback: the dashboard runs with network_mode: host
      # (so its OIDC issuer matches the browser's) and reaches immudb here.
      # Everything else uses the compose network.
      - "127.0.0.1:3322:3322"
      # The web console is NOT published. It served the audit ledger to anyone
      # who could reach the port, with no gateway in front of it.
    networks:
      - backend


  # The database inspector, for the launcher's admins (Manage > Inspect database on a project page).
  # Reached only through Caddy at :8100/inspect/pgadmin, behind the sign-in and the platform's
  # admin gate, so it runs in desktop mode with no login of its own. It connects as inspector_ro
  # (init/inspector-role.sql): SELECT everywhere it may connect, read-only sessions. The image keeps
  # /var/lib/pgadmin in a volume, which outlives the container, so the password file is rewritten
  # and the server list reloaded on every start rather than only on the first.
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # The entrypoint insists on these even in desktop mode, where nobody logs in with them.
      PGADMIN_DEFAULT_EMAIL: inspector@aisc.example.org
      PGADMIN_DEFAULT_PASSWORD: unused-in-desktop-mode
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGPASS_FILE: /tmp/pgpass
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      SCRIPT_NAME: /inspect/pgadmin
      INSPECTOR_PASSWORD: ${INSPECTOR_PASSWORD:?run scripts/secrets.sh first}
    # The password file is written from the environment, so the secret never sits in the repo.
    entrypoint: >
      sh -c "printf 'postgres:5432:*:inspector_ro:%s\\n' \"$$INSPECTOR_PASSWORD\" > /tmp/pgpass
      && chmod 600 /tmp/pgpass && cp /tmp/pgpass /var/lib/pgadmin/.pgpass
      && chmod 600 /var/lib/pgadmin/.pgpass && exec /entrypoint.sh"
    volumes:
      - ./inspector/pgadmin-servers.json:/pgadmin4/servers.json:ro,Z
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      # Only caddy (the admin gate at /inspect/*) and postgres share this network, so no plugin
      # or other service can reach it (API auth WP3).
      - inspector

  # Schema diagrams, the other half of the inspector: SchemaSpy's pages for one database (the
  # platform's or a project's), made on the first visit and again after ten minutes. Behind the same
  # admin gate, at :8100/inspect/schema/<database>/. Reads as inspector_ro.
  schema-docs:
    build: inspector/schema-docs/
    image: aisc-schema-docs:${AISC_IMAGE_TAG:-latest}
    pull_policy: never
    container_name: schema-docs
    environment:
      PGHOST: postgres
      INSPECTOR_PASSWORD: ${INSPECTOR_PASSWORD:?run scripts/secrets.sh first}
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      # Only caddy (the admin gate at /inspect/*) and postgres share this network, so no plugin
      # or other service can reach it (API auth WP3).
      - inspector

volumes:
  immudb_data: # Persistent storage for the immudb ledger
  minio_data: # Persistent storage for MinIO
  postgres_data: # Persistent storage for PostgreSQL
  rabbitmq_data: # Persistent storage for RabbitMQ
  redis_data: # Persistent storage for Redis
  catalogue_sqlite: # the catalogue's own SQLite database (apps/catalogue)
  devpi_data: # the package index the catalogue installs from

networks:
  backend:
  frontend:
  # pgadmin, schema-docs, caddy and postgres only (API auth WP3)
  inspector:
